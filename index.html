<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RPG Fitness: Status Quest - 冒険者ギルド編</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyber: {
              black: '#070913',
              card: '#121829',
              cyan: '#00f0ff',
              pink: '#ff4d94',
              gold: '#ffd166',
            }
          },
          boxShadow: {
            'neon-cyan': '0 0 15px rgba(0, 240, 255, 0.45), 0 0 30px rgba(0, 240, 255, 0.2)',
            'neon-pink': '0 0 15px rgba(255, 77, 148, 0.45), 0 0 30px rgba(255, 77, 148, 0.2)',
            'neon-gold': '0 0 20px rgba(255, 209, 102, 0.5)',
          },
          animation: {
            'float': 'float 3s ease-in-out infinite',
            'spin-slow': 'spin 12s linear infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Orbitron:wght@700;900&family=Rajdhani:wght@700&display=swap');
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #070913;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-scifi {
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.08em;
    }
    .cyber-grid {
      background-size: 28px 28px;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
    }
    .scanline {
      background: linear-gradient(rgba(18, 16, 25, 0) 50%, rgba(5, 5, 12, 0.3) 50%);
      background-size: 100% 4px;
    }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<!-- この後に続くメインコードは上記の index.html ファイル内に完全収録されています -->
