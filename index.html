    const RANK_THRESHOLDS = [
      { rank: 'F', min: 0, max: 9, cap: 10 },

      { rank: 'A', min: 120, max: 169, cap: 170 },
      { rank: 'S', min: 170, max: 99999, cap: 200 },
    ];

    function getStatRankInfo(val) {
      for (let i = RANK_THRESHOLDS.length - 1; i >= 0; i--) {
        if (val >= RANK_THRESHOLDS[i].min) return RANK_THRESHOLDS[i];
      }
      return RANK_THRESHOLDS[0];
    }

    function calculateOverallRank(stats) {
      const vals = [stats.strength || 0, stats.agility || 0, stats.flexibility || 0, stats.intelligence || 0].sort((a, b) => b - a);
      const top2Avg = (vals[0] + vals[1]) / 2;
      return { rank: getStatRankInfo(top2Avg).rank, avgVal: Math.round(top2Avg) };
    }

    function determineJob(stats) {
      const statList = [
        { key: 'strength', name: '筋力', val: stats.strength || 0 },
        { key: 'agility', name: '俊敏', val: stats.agility || 0 },
        { key: 'flexibility', name: '柔軟', val: stats.flexibility || 0 },
        { key: 'intelligence', name: '知力', val: stats.intelligence || 0 },
      ].sort((x, y) => y.val - x.val);

      const top1 = statList[0];
      const top2 = statList[1];
      const avgTop2 = (top1.val + top2.val) / 2;

      if (avgTop2 < 25) {
        return { name: '見習い冒険者', tier: '見習い', desc: '街の雑用や基礎体力を鍛える駆け出し冒険者' };
      }

      const isHighTier = avgTop2 >= 80;
      const isDual = (top1.val - top2.val) <= 15;

      if (isDual) {
        const combo = [top1.key, top2.key].sort().join('+');

          case 'agility+strength':
            return isHighTier ? { name: '拳聖', tier: '上級職', desc: '気功と連撃を極めた体術の頂点' } : { name: '武闘家', tier: '基本職', desc: '拳と蹴りの速射で圧倒する格闘家' };

            return isHighTier ? { name: '忍者', tier: '上級職', desc: '神出鬼没の身のこなしで死角を制する達人' } : { name: '忍び', tier: '基本職', desc: '身軽さと柔軟さで敵を惑わす下忍' };

            return isHighTier ? { name: 'ネクロマンサー', tier: '上級職', desc: '深淵の知恵と異界の気配を受け流す死霊術士' } : { name: '呪術師', tier: '基本職', desc: '霊的な気配を読みデバフを操る術士' };
          default:

      { id: 'a2', rank: 'A', name: '古代遺跡の守護神・鋼鉄ガーゴイル', desc: '超硬度装甲と高位障壁を纏う古代兵器。', reqStreak: 14, reqTypes: ['筋力', '知力'], reqStats: { strength: 130, intelligence: 130 }, failLogs: { strength: '装甲が硬すぎる！刃が弾かれた。【筋力】を鍛えよう！', intelligence: '障壁解除コードが解読できない！【知力】を極限まで高めよう！' }, rewardGold: 750, rewardTitle: '古代の解縛者' },
      { id: 'a3', rank: 'A', name: '禁忌の降霊儀式・絶対結界遮断', desc: '都市壊滅を狙う邪神降霊陣の詠唱を逆算し遮断する。', reqStreak: 14, reqTypes: ['知力', '柔軟'], reqStats: { intelligence: 145, flexibility: 125 }, failLogs: { intelligence: '術式反転についていけない！【知力】を極限まで高めよう！', flexibility: '魔力逆流を受け流せず気絶した！【柔軟】を鍛えよう！' }, rewardGold: 780, rewardTitle: '天理の大賢者' },

      // Sランク
      { id: 's1', rank: 'S', name: '終焉の古竜・邪神討伐', desc: '世界存亡を賭けた規格外の厄災との決戦。', reqStreak: 30, reqTypes: ['筋力', '俊敏', '柔軟', '知力'], reqStats: { strength: 170, agility: 170, flexibility: 170, intelligence: 170 }, failLogs: { strength: 'パワーが足りない！【筋力】を極めよう！', agility: 'ブレスを回避できない！【俊敏】を極めよう！', flexibility: '衝撃波をいなせない！【柔軟】を極めよう！', intelligence: '結界の真理を見破れない！【知力】を極めよう！' }, rewardGold: 2500, rewardTitle: '世界を救いし伝説の勇者' },
      { id: 's2', rank: 'S', name: '世界の記憶・創世の魔道典解放', desc: '世界の全真理を脳内に取り込み調和させる。', reqStreak: 30, reqTypes: ['知力', '柔軟'], reqStats: { intelligence: 180, flexibility: 170 }, failLogs: { intelligence: '知識量に耐えきれず意識が混濁した！【知力】を極めよう！', flexibility: '神気の奔流に耐えきれなかった！【柔軟】を極めよう！' }, rewardGold: 3000, rewardTitle: '神域の全知者' }
    ];

    function getDailyAvailableQuests(dayTimestamp) {
      const date = new Date(dayTimestamp);
      const dayNum = Math.floor(date.getTime() / (1000 * 60 * 60 * 24));
      
      const ranks = ['F', 'E', 'D', 'C', 'B', 'A', 'S'];
      const result = [];

      ranks.forEach(r => {
        const questsInRank = ALL_GUILD_QUESTS.filter(q => q.rank === r);
        if (questsInRank.length === 0) return;

        if (r === 'F') {
          result.push(...questsInRank);
        } else {
          const primaryIdx = Math.abs(dayNum) % questsInRank.length;
          result.push(questsInRank[primaryIdx]);

          questsInRank.forEach((q, idx) => {
            if (idx !== primaryIdx) {
              const hash = (dayNum * 19 + q.id.charCodeAt(0) * 11 + idx * 7) % 100;
              if (hash < 50) {
                result.push(q);
              }
            }
          });
        }
      });

      return result;
    }

    const INITIAL_PLAYER_DATA = {
      name: 'HERO',
      themeColor: 'cyan',
      customAvatar: null,
      gold: 30,
      stats: { strength: 0, agility: 0, flexibility: 0, intelligence: 0 },
      lastTrainedDates: { strength: null, agility: null, flexibility: null, intelligence: null },
      activeTitle: '見習い冒険者',
      unlockedTitles: ['見習い冒険者'],
      dailyClearedQuests: [],
      streakCount: 1,
      lastActiveDate: null,
      isCamping: false,
      logs: []
    };

    function App() {
      const [player, setPlayer] = useState(() => {
        const saved = localStorage.getItem('rpg_fitness_player_guild_v19');
        return saved ? JSON.parse(saved) : INITIAL_PLAYER_DATA;
      });

      const [activeTab, setActiveTab] = useState('train');
      const [selectedPreset, setSelectedPreset] = useState(PRESETS[0]);
      const [inputValue, setInputValue] = useState(PRESETS[0].defaultVal);
      const [isStatusOpen, setIsStatusOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false); // 設定モーダル
      const [isResetConfirmOpen, setIsResetConfirmOpen] = useState(false); // 初期化確認モーダル
      const [selectedRankTab, setSelectedRankTab] = useState('F');
      const [questResultModal, setQuestResultModal] = useState(null);
      const [innBillNotice, setInnBillNotice] = useState(null);
      const [blockedNotice, setBlockedNotice] = useState(null);

      const [timerSeconds, setTimerSeconds] = useState(0);
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const timerIntervalRef = useRef(null);
      const fileInputRef = useRef(null);

      const overall = calculateOverallRank(player.stats);
      const currentJob = determineJob(player.stats);
      const inn = getInnInfo(currentJob.tier);

      // 日付変更チェック
      useEffect(() => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const todayTime = today.getTime();

        if (player.lastActiveDate) {
          const lastDate = new Date(player.lastActiveDate);
          lastDate.setHours(0, 0, 0, 0);
          const diffDays = Math.floor((todayTime - lastDate.getTime()) / (1000 * 60 * 60 * 24));

          if (diffDays >= 1) {
            const cost = diffDays * inn.costPerDay;
            const newGold = player.gold - cost;
            const camping = newGold < 0;

            const newStats = { ...player.stats };
            ['strength', 'agility', 'flexibility', 'intelligence'].forEach(k => {
              if (player.lastTrainedDates[k]) {
                const td = new Date(player.lastTrainedDates[k]);
                td.setHours(0, 0, 0, 0);
                const idle = Math.floor((todayTime - td.getTime()) / (1000 * 60 * 60 * 24));
                if (idle >= 3) {
                  newStats[k] = Math.max(0, newStats[k] - (idle - 2));
                }
              }
            });

            const newStreak = diffDays === 1 ? (player.streakCount || 1) + 1 : 1;

            setPlayer(prev => ({
              ...prev,
              gold: newGold,
              stats: newStats,
              streakCount: newStreak,
              lastActiveDate: todayTime,
              dailyClearedQuests: [],
              isCamping: camping
            }));

            setInnBillNotice({ innName: inn.name, cost, days: diffDays, remainingGold: newGold, isCamping: camping });
          }
        } else {
          setPlayer(prev => ({ ...prev, lastActiveDate: todayTime }));
        }
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem('rpg_fitness_player_guild_v19', JSON.stringify(player));
        } catch (e) {
          console.error("Storage error:", e);
        }
      }, [player]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, selectedPreset, isStatusOpen, isSettingsOpen, isResetConfirmOpen, selectedRankTab, questResultModal, innBillNotice, blockedNotice, player]);

      useEffect(() => {
        if (isTimerRunning) {
          timerIntervalRef.current = setInterval(() => setTimerSeconds(p => p + 1), 1000);
        } else if (timerIntervalRef.current) {
          clearInterval(timerIntervalRef.current);
        }
        return () => { if (timerIntervalRef.current) clearInterval(timerIntervalRef.current); };
      }, [isTimerRunning]);

      const formatTimer = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const handleResetTimer = () => {
        setIsTimerRunning(false);
        setTimerSeconds(0);
      };

      const cycleThemeColor = () => {
        const colors = ['cyan', 'purple', 'pink'];
        const nextIdx = (colors.indexOf(player.themeColor || 'cyan') + 1) % colors.length;
        setPlayer(prev => ({ ...prev, themeColor: colors[nextIdx] }));
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 300;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_SIZE) {
                height = Math.round((height * MAX_SIZE) / width);
                width = MAX_SIZE;
              }
            } else {
              if (height > MAX_SIZE) {
                width = Math.round((width * MAX_SIZE) / height);
                height = MAX_SIZE;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
            setPlayer(prev => ({ ...prev, customAvatar: compressedDataUrl }));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      // データ初期化の実行
      const executeReset = () => {
        localStorage.removeItem('rpg_fitness_player_guild_v19');
        setPlayer(INITIAL_PLAYER_DATA);
        setIsResetConfirmOpen(false);
        setIsSettingsOpen(false);
        setIsStatusOpen(false);
        window.location.reload();
      };

      const handleRecord = () => {
        const amount = Number(inputValue);
        if (!amount || amount <= 0) return;

        let gained = Math.floor(amount / selectedPreset.stepVal) * selectedPreset.gain;
        if (gained < 1) gained = selectedPreset.gain;
        if (player.isCamping) gained = Math.max(1, Math.floor(gained * 0.5));

        const cat = selectedPreset.category;
        const nextVal = (player.stats[cat] || 0) + gained;
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        setPlayer(prev => ({
          ...prev,
          stats: { ...prev.stats, [cat]: nextVal },
          lastTrainedDates: { ...prev.lastTrainedDates, [cat]: today.getTime() }
        }));

        if (window.confetti) window.confetti({ particleCount: 70, spread: 60, origin: { y: 0.7 } });
      };

      const handleAttemptQuest = (quest) => {
        const clearedList = player.dailyClearedQuests || [];
        if (clearedList.includes(quest.id)) {
          setBlockedNotice({ title: 'ミッション達成済み', text: 'こちらのミッションは本日達成済みです。明日になると再び受注できます！' });
          return;
        }

        const curStreak = player.streakCount || 1;
        if (quest.reqStreak && curStreak < quest.reqStreak) {
          setBlockedNotice({
            title: '冒険者ギルドの信用不足',
            text: `この高位依頼を受注するには、継続鍛錬日数があと【${quest.reqStreak - curStreak}日】不足しています（必要継続: ${quest.reqStreak}日 / 現在: ${curStreak}日）。日々の鍛錬を継続してギルドの信用を高めましょう！`
          });
          return;
        }

        let isSuccess = true;
        const details = [];
        const statNameMap = { strength: '筋力', agility: '俊敏', flexibility: '柔軟', intelligence: '知力' };

        for (let k in quest.reqStats) {
          const req = quest.reqStats[k];
          const cur = player.stats[k] || 0;
          const passed = cur >= req;
          if (!passed) isSuccess = false;
          details.push({
            name: statNameMap[k],
            current: cur,
            required: req,
            diff: req - cur,
            passed: passed,
            failAdvice: quest.failLogs[k]
          });
        }

        if (isSuccess) {
          const newGold = player.gold + quest.rewardGold;
          const wasCamping = player.isCamping;
          const nowCamping = newGold < 0;

          const updatedTitles = [...player.unlockedTitles];
          if (quest.rewardTitle && !updatedTitles.includes(quest.rewardTitle)) {
            updatedTitles.push(quest.rewardTitle);
          }

          const newDailyCleared = [...clearedList, quest.id];

          setPlayer(prev => ({
            ...prev,
            gold: newGold,
            unlockedTitles: updatedTitles,
            dailyClearedQuests: newDailyCleared,
            isCamping: nowCamping
          }));

          setQuestResultModal({ quest, success: true, details, wasCampingRecovered: wasCamping && !nowCamping });
          if (window.confetti) window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        } else {
          setQuestResultModal({ quest, success: false, details });
        }
      };

      const theme = player.themeColor || 'cyan';
      const themeText = theme === 'cyan' ? 'text-cyan-400' : theme === 'purple' ? 'text-purple-400' : 'text-pink-400';
      const themeBorder = theme === 'cyan' ? 'border-cyan-500/40' : theme === 'purple' ? 'border-purple-500/40' : 'border-pink-500/40';
      const themeBtn = theme === 'cyan' ? 'bg-cyan-500 text-slate-950' : theme === 'purple' ? 'bg-purple-600 text-white' : 'bg-pink-500 text-white';
      const themeShadow = theme === 'cyan' ? 'shadow-neon-cyan' : theme === 'purple' ? 'shadow-neon-purple' : 'shadow-neon-pink';

      const todayQuests = getDailyAvailableQuests(player.lastActiveDate || Date.now());
      const filteredQuests = todayQuests.filter(q => q.rank === selectedRankTab);
      const dailyCleared = player.dailyClearedQuests || [];

      return (
        <div className="max-w-md mx-auto min-h-screen relative flex flex-col justify-between pb-36 bg-[#090c16] border-x border-slate-800 shadow-2xl">
          
          <input type="file" accept="image/*" ref={fileInputRef} onChange={handleImageUpload} className="hidden" />

          {/* ヘッダー */}
          <header className="p-3 border-b border-slate-800 bg-[#0e1222]/95 backdrop-blur sticky top-0 z-30 flex justify-between items-center">
            <div className="flex items-center space-x-2.5">
              <div 
                onClick={() => fileInputRef.current.click()} 
                title="タップして好きな画像に変更"
                className={`w-11 h-11 rounded-2xl border flex items-center justify-center cursor-pointer overflow-hidden p-0.5 bg-slate-900 ${themeBorder} ${themeShadow} relative group`}
              >
                {player.customAvatar ? (
                  <img src={player.customAvatar} alt="Avatar" className="w-full h-full object-cover rounded-xl" />
                ) : (
                  <div className="text-center">
                    <i data-lucide="image-plus" className="w-5 h-5 text-slate-400 group-hover:text-white"></i>
                  </div>
                )}
                <div className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center text-[8px] text-white font-bold transition">
                  変更
                </div>
              </div>

              <div>
                <div className="flex items-center space-x-2">
                  <span className="text-[10px] text-slate-400 font-bold">総合Rank</span>
                  <span className={`font-scifi text-base font-black ${themeText}`}>{overall.rank}</span>
                  <span className={`text-xs font-bold font-scifi ml-1.5 ${player.gold < 0 ? 'text-red-400 animate-pulse' : 'text-amber-300'}`}>
                    🪙 {player.gold} G
                  </span>
                </div>
                <div className="text-[10px] text-slate-300 font-bold truncate max-w-[130px]">
                  <span className="text-amber-400">【{currentJob.name}】</span>
                </div>
              </div>
            </div>

            <button 
              onClick={cycleThemeColor}
              className="px-2.5 py-1.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-200 text-xs font-bold flex items-center space-x-1 hover:border-slate-500 transition"
            >
              <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: theme === 'cyan' ? '#00f0ff' : theme === 'purple' ? '#b026ff' : '#ff4d94' }}></span>
              <span>{theme === 'cyan' ? 'シアン' : theme === 'purple' ? 'パープル' : 'ピンク'}</span>
            </button>
          </header>

          {/* 野宿バナー */}
          {player.isCamping && (
            <div className="mx-3 mt-2 p-2 rounded-xl bg-red-950/90 border border-red-500/80 text-red-200 text-xs">
              <div className="font-bold text-[11px] text-red-300">⚠️【野宿生活】能力上昇値が半減中！</div>
              <div className="text-[9px] text-slate-300">所持金が尽き、宿を追い出されました。依頼をこなして宿代を稼ぎましょう！</div>
            </div>
          )}

          {/* メイン画面 */}
          <main className="p-3.5 flex-1 space-y-3">
            
            {/* ステータス概要 */}
            <div className={`rounded-2xl border bg-gradient-to-b from-[#141829] to-[#0d101e] p-3 shadow-lg ${themeBorder} space-y-2`}>
              <div className="flex justify-between items-center">
                <span className="text-[11px] text-amber-300 font-bold bg-black/40 px-2.5 py-0.5 rounded-full border border-amber-400/30">
                  🔥 鍛錬継続 {player.streakCount || 1} 日目 (信用度)
                </span>
                <div className="flex items-center space-x-1">
                  <span className="text-slate-400 text-xs font-bold">総合Rank</span>
                  <span className={`font-scifi font-black text-xl ${themeText}`}>{overall.rank}</span>
                </div>
              </div>

              <div className="grid grid-cols-4 gap-1.5 pt-1 text-center font-mono">
                <div className="bg-slate-950/70 p-1.5 rounded-xl border border-red-900/40">
                  <div className="text-[9px] text-red-400 font-bold">筋力</div>
                  <div className="text-xs font-scifi font-bold text-white mt-0.5">{player.stats.strength}</div>
                  <div className="text-[9px] text-slate-400">Rank {getStatRankInfo(player.stats.strength).rank}</div>
                </div>
                <div className="bg-slate-950/70 p-1.5 rounded-xl border border-cyan-900/40">
                  <div className="text-[9px] text-cyan-400 font-bold">俊敏</div>
                  <div className="text-xs font-scifi font-bold text-white mt-0.5">{player.stats.agility}</div>
                  <div className="text-[9px] text-slate-400">Rank {getStatRankInfo(player.stats.agility).rank}</div>
                </div>
                <div className="bg-slate-950/70 p-1.5 rounded-xl border border-emerald-900/40">
                  <div className="text-[9px] text-emerald-400 font-bold">柔軟</div>
                  <div className="text-xs font-scifi font-bold text-white mt-0.5">{player.stats.flexibility}</div>
                  <div className="text-[9px] text-slate-400">Rank {getStatRankInfo(player.stats.flexibility).rank}</div>
                </div>
                <div className="bg-slate-950/70 p-1.5 rounded-xl border border-purple-900/40">
                  <div className="text-[9px] text-purple-400 font-bold">知力</div>
                  <div className="text-xs font-scifi font-bold text-white mt-0.5">{player.stats.intelligence}</div>
                  <div className="text-[9px] text-slate-400">Rank {getStatRankInfo(player.stats.intelligence).rank}</div>
                </div>
              </div>
            </div>

            {/* ① 鍛錬タブ */}
            {activeTab === 'train' && (
              <div className="space-y-3">
                {/* クエストタイマー */}
                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-3 flex items-center justify-between shadow-lg">
                  <div>
                    <div className="text-[10px] text-slate-400 font-bold">QUEST TIMER</div>
                    <div className="font-scifi font-black text-xl text-white tracking-widest">{formatTimer(timerSeconds)}</div>
                  </div>
                  <div className="flex items-center space-x-1.5">
                    <button
                      onClick={() => setIsTimerRunning(!isTimerRunning)}
                      className={`px-3.5 py-2 rounded-xl font-bold text-xs transition ${
                        isTimerRunning ? 'bg-amber-500 text-slate-950' : themeBtn
                      }`}
                    >
                      {isTimerRunning ? "一時停止" : "スタート"}
                    </button>
                    {timerSeconds > 0 && (
                      <button
                        onClick={() => { setIsTimerRunning(false); setInputValue(Math.max(1, Math.round(timerSeconds / 60))); }}
                        className="px-2.5 py-2 rounded-xl bg-emerald-500/20 border border-emerald-500/50 text-emerald-300 text-xs font-bold"
                      >
                        反映
                      </button>
                    )}
                    <button
                      onClick={handleResetTimer}
                      title="タイマーをリセット"
                      className="px-2.5 py-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white border border-slate-700 text-xs font-bold transition"
                    >
                      リセット
                    </button>
                  </div>
                </div>

                {/* 記録入力欄 */}
                <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 space-y-2">
                  <div className="flex justify-between items-center text-xs">
                    <span className="text-slate-200 font-bold text-sm">{selectedPreset.name} ({selectedPreset.unit})</span>
                    <span className="text-cyan-400 font-mono text-xs">
                      上昇見込: <strong className="text-white text-base">+{Math.max(1, Math.floor(inputValue / selectedPreset.stepVal) * selectedPreset.gain * (player.isCamping ? 0.5 : 1))}</strong> ({selectedPreset.statName})
                    </span>
                  </div>
                  <div className="flex space-x-1.5">
                    {[10, 20, 30, 50].map(num => (
                      <button key={num} onClick={() => setInputValue(num)} className="flex-1 py-1.5 rounded-lg bg-slate-800/80 border border-slate-700 text-xs text-slate-300 hover:border-slate-500">
                        {num}
                      </button>
                    ))}
                  </div>
                  <div className="flex items-center space-x-2 pt-1">
                    <input
                      type="number" min="1" max="999" value={inputValue}
                      onChange={(e) => setInputValue(Math.max(1, parseInt(e.target.value) || 1))}
                      className="w-24 bg-slate-950 border-2 border-slate-700 rounded-xl py-2 text-center text-xl font-scifi font-bold text-white focus:outline-none focus:border-cyan-400"
                    />
                    <button
                      onClick={handleRecord}
                      className={`flex-1 font-black py-3 rounded-xl text-xs font-scifi active:scale-95 transition ${themeBtn} ${themeShadow}`}
                    >
                      TRAIN COMPLETED
                    </button>
                  </div>
                </div>

                {/* 鍛錬メニュー選択 */}
                <div className="space-y-1.5">
                  <div className="text-[11px] font-bold text-slate-400 px-1">鍛錬メニュー選択</div>
                  <div className="grid grid-cols-3 gap-2">
                    {PRESETS.map(p => {
                      const isSelected = selectedPreset.id === p.id;
                      return (
                        <button
                          key={p.id}
                          onClick={() => { setSelectedPreset(p); setInputValue(p.defaultVal); }}
                          className={`p-2.5 rounded-xl border transition text-left flex flex-col justify-between ${
                            isSelected 
                              ? `bg-slate-900 border-${theme === 'cyan' ? 'cyan-400' : theme === 'purple' ? 'purple-400' : 'pink-400'} text-white ${themeShadow}`
                              : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:border-slate-700'
                          }`}
                        >
                          <span className="text-xs font-bold truncate text-white">{p.name}</span>
                          <div className="mt-1.5 flex justify-between items-center text-[10px]">
                            <span className="text-slate-400">{p.statName}</span>
                            <span className={`font-mono font-bold ${themeText}`}>
                              +{p.gain} ({p.stepVal}{p.unit})
                            </span>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* ② 冒険者ギルドタブ（ドット絵受付嬢キャラクター配置） */}
            {activeTab === 'guild' && (
              <div className="space-y-3">
                
                {/* ギルド受付嬢カウンター */}
                <div className="bg-gradient-to-r from-slate-900 via-slate-900/95 to-slate-950 border border-amber-500/50 rounded-2xl p-3 flex items-center space-x-3 shadow-xl">
                  <GuildReceptionistPixel size={56} />
                  <div className="space-y-0.5">
                    <div className="flex items-center space-x-1.5">
                      <span className="text-xs font-bold text-amber-300">ギルド職員 クレア</span>
                      <span className="text-[9px] bg-amber-950/90 text-amber-400 border border-amber-500/30 px-1.5 rounded">受付窓口</span>
                    </div>
                    <p className="text-[10.5px] text-slate-300 leading-tight">
                      「冒険者さん、本日も鍛錬ご苦労さまです！無理のないよう怪我に気をつけて依頼に挑んでくださいね。」
                    </p>
                  </div>
                </div>

                {/* 掲示板本体 */}
                <div className="bg-slate-900/90 border border-amber-500/40 rounded-2xl p-3 space-y-2.5 shadow-xl">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                    <div>
                      <span className="font-bold text-xs text-slate-100 tracking-wider">📜 本日のギルド掲示板</span>
                      <span className="text-[9px] text-amber-300 ml-1.5 bg-amber-950/80 px-1 rounded border border-amber-500/30">日替わり公開中</span>
                    </div>
                    <div className="text-[10px] text-slate-400 flex items-center space-x-1">
                      <span>適正:</span>
                      <strong className="text-amber-300 font-scifi font-bold text-sm">Rank {overall.rank}</strong>
                    </div>
                  </div>

                  {/* ランク切り替えタブ */}
                  <div className="flex space-x-1 overflow-x-auto pb-1">
                    {['F', 'E', 'D', 'C', 'B', 'A', 'S'].map(r => (
                      <button
                        key={r}
                        onClick={() => setSelectedRankTab(r)}
                        className={`px-2.5 py-1 rounded-lg text-xs font-scifi font-bold flex-1 text-center transition ${
                          selectedRankTab === r ? 'bg-amber-500 text-slate-950 shadow-lg' : 'bg-slate-800/60 text-slate-400 border border-slate-700/60'
                        }`}
                      >
                        {r}級
                      </button>
                    ))}
                  </div>

                  {/* 依頼リスト */}
                  <div className="space-y-2 max-h-80 overflow-y-auto pr-0.5">
                    {filteredQuests.length === 0 ? (
                      <div className="p-6 text-center text-xs text-slate-500">
                        本日このランクの依頼は掲示されていません。<br/>
                        明日の掲示板更新をお待ちください。
                      </div>
                    ) : (
                      filteredQuests.map(q => {
                        const isClear = dailyCleared.includes(q.id);

                        return (
                          <div key={q.id} className="p-3 rounded-xl border border-slate-800 bg-slate-950/70 space-y-2">
                            <div className="flex justify-between items-start">
                              <div>
                                <div className="font-bold text-xs text-white flex items-center space-x-1.5">
                                  <span>{q.name}</span>
                                  {isClear && (
                                    <span className="text-[9px] font-scifi font-black text-amber-300 bg-amber-950/80 px-1.5 py-0.5 rounded border border-amber-400 tracking-wider">
                                      CLEAR
                                    </span>
                                  )}
                                </div>
                                <div className="text-[11px] text-slate-400 mt-0.5">{q.desc}</div>
                              </div>
                            </div>

                            <div className="flex justify-between items-center pt-1.5 border-t border-slate-800/80 text-[11px]">
                              <div className="text-slate-400">
                                要求: <span className="text-cyan-300 font-bold">{q.reqTypes.join(' ＋ ')}</span>
                                <span className="text-amber-300 font-bold ml-2">🪙 +{q.rewardGold}G</span>
                              </div>
                              <button
                                onClick={() => handleAttemptQuest(q)}
                                className={`px-3 py-1 rounded-lg font-bold text-xs active:scale-95 transition ${themeBtn}`}
                              >
                                挑戦する
                              </button>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* 下部固定ナビゲーション */}
          <div className="fixed bottom-3 left-0 right-0 max-w-md mx-auto px-3.5 z-30">
            <div className="p-2 rounded-2xl bg-slate-950/95 border border-slate-800 backdrop-blur shadow-2xl flex items-center space-x-2">
              <button
                onClick={() => setActiveTab('train')}
                className={`flex-1 py-2.5 rounded-xl font-bold text-xs flex items-center justify-center space-x-1.5 transition ${
                  activeTab === 'train' ? `${themeBtn} ${themeShadow}` : 'bg-slate-900 text-slate-400 border border-slate-800'
                }`}
              >
                <i data-lucide="dumbbell" className="w-4 h-4"></i>
                <span>鍛錬メニュー</span>
              </button>

              <button
                onClick={() => setActiveTab('guild')}
                className={`flex-1 py-2.5 rounded-xl font-bold text-xs flex items-center justify-center space-x-1.5 transition ${
                  activeTab === 'guild' ? `${themeBtn} ${themeShadow}` : 'bg-slate-900 text-slate-400 border border-slate-800'
                }`}
              >
                <i data-lucide="scroll" className="w-4 h-4"></i>
                <span>冒険者ギルド</span>
              </button>

              <button
                onClick={() => setIsStatusOpen(true)}
                className="px-4 py-2.5 rounded-xl font-scifi font-black text-xs tracking-wider bg-slate-900 border border-slate-700 text-amber-300 hover:text-white"
              >
                STATUS
              </button>
            </div>
          </div>

          {/* 警告モーダル */}
          {blockedNotice && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-6">
              <div className="bg-slate-900 border border-amber-500/50 rounded-2xl p-5 max-w-xs w-full text-center space-y-3">
                <div className="w-10 h-10 rounded-full bg-amber-500/20 text-amber-300 flex items-center justify-center mx-auto">
                  <i data-lucide="alert-triangle" className="w-6 h-6"></i>
                </div>
                <h3 className="font-bold text-sm text-white">{blockedNotice.title}</h3>
                <p className="text-xs text-slate-300 leading-relaxed">{blockedNotice.text}</p>
                <button 
                  onClick={() => setBlockedNotice(null)} 
                  className="w-full py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs"
                >
                  閉じる
                </button>
              </div>
            </div>
          )}

          {/* 宿屋支払いモーダル */}
          {innBillNotice && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-6">
              <div className="bg-slate-900 border border-amber-500/50 rounded-2xl p-5 max-w-xs w-full text-center space-y-3">
                <h3 className="font-bold text-sm text-white">宿屋と食事の支払い</h3>
                <div className="text-xs text-slate-300 space-y-1.5">
                  <div className="text-amber-400 font-bold">【{innBillNotice.innName}】</div>
                  <p>滞在日数: <strong className="text-white font-mono">{innBillNotice.days}</strong> 日分</p>
                  <p className="text-amber-300 font-bold font-mono text-sm">宿泊・飲食費: -{innBillNotice.cost} G</p>
                </div>
                {innBillNotice.isCamping ? (
                  <div className="p-2 rounded-xl bg-red-950/60 border border-red-500/40 text-[11px] text-red-300">
                    ⚠️ 所持金が尽きたため【野宿生活】になりました！依頼をこなして宿代を稼ぎましょう！
                  </div>
                ) : (
                  <div className="text-xs text-emerald-300 font-bold">
                    十分な休息を取りました！（残金: {innBillNotice.remainingGold} G）
                  </div>
                )}
                <button onClick={() => setInnBillNotice(null)} className="w-full py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs">
                  了解
                </button>
              </div>
            </div>
          )}

          {/* 判定結果モーダル */}
          {questResultModal && (
            <div className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-5">
              <div className={`bg-slate-900 border-2 rounded-2xl p-5 max-w-sm w-full space-y-3 ${
                questResultModal.success ? 'border-amber-400 shadow-neon-gold' : 'border-red-500/60'
              }`}>
                <div className="text-center">
                  <div className="text-2xl">{questResultModal.success ? '⚔️' : '❌'}</div>
                  <h3 className={`font-bold text-base ${questResultModal.success ? 'text-amber-300' : 'text-red-400'}`}>
                    {questResultModal.success ? 'ミッション達成！' : 'ミッション失敗……！'}
                  </h3>
                  <div className="text-xs text-slate-300 font-bold mt-0.5">{questResultModal.quest.name}</div>
                </div>

                <div className="space-y-1 bg-slate-950/70 p-3 rounded-xl border border-slate-800 text-xs font-mono">
                  {questResultModal.details.map((d, i) => (
                    <div key={i} className="flex justify-between items-center py-0.5">
                      <span className="text-slate-300">{d.name}</span>
                      <span className={d.passed ? 'text-emerald-400 font-bold' : 'text-red-400 font-bold'}>
                        {d.current} / {d.required} ({d.passed ? 'クリア' : `あと ${d.diff} 不足`})
                      </span>
                    </div>
                  ))}
                </div>

                {questResultModal.success ? (
                  <div className="p-2.5 rounded-xl bg-amber-950/40 border border-amber-500/30 text-xs text-amber-200">
                    <div>🪙 報奨獲得: +{questResultModal.quest.rewardGold} G</div>
                    {questResultModal.quest.rewardTitle && <div>🎖️ 新称号: 『{questResultModal.quest.rewardTitle}』</div>}
                  </div>
                ) : (
                  <div className="p-2.5 rounded-xl bg-red-950/40 border border-red-500/30 text-xs text-red-200 space-y-1">
                    {questResultModal.details.filter(d => !d.passed).map((d, i) => (
                      <div key={i} className="text-[11px]">• {d.failAdvice}</div>
                    ))}
                  </div>
                )}

                <button onClick={() => setQuestResultModal(null)} className="w-full py-2.5 rounded-xl font-bold text-xs bg-slate-800 text-slate-200">
                  閉じる
                </button>
              </div>
            </div>
          )}

          {/* ステータス全画面モーダル（⚙️歯車アイコン追加） */}
          {isStatusOpen && (
            <div className="fixed inset-0 z-50 bg-black/95 flex flex-col p-5 overflow-y-auto">
              <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                <span className={`font-scifi text-xs ${themeText}`}>STATUS INTERFACE</span>
                <div className="flex items-center space-x-3">
                  {/* 設定ボタン */}
                  <button 
                    onClick={() => setIsSettingsOpen(true)} 
                    title="設定"
                    className="p-1.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-400 hover:text-white hover:border-slate-500 transition"
                  >
                    <i data-lucide="settings" className="w-4 h-4"></i>
                  </button>
                  <button onClick={() => setIsStatusOpen(false)} className="text-slate-400 hover:text-white text-lg font-bold">✕</button>
                </div>
              </div>

              <div className="mt-3 bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center space-y-2">
                <div className="flex justify-center">
                  <div 
                    onClick={() => fileInputRef.current.click()}
                    className={`w-28 h-28 rounded-2xl border-2 overflow-hidden bg-slate-950 flex items-center justify-center cursor-pointer ${themeBorder} ${themeShadow}`}
                  >
                    {player.customAvatar ? (
                      <img src={player.customAvatar} alt="Avatar" className="w-full h-full object-cover" />
                    ) : (
                      <div className="text-center p-2">
                        <i data-lucide="image-plus" className="w-7 h-7 text-slate-500 mx-auto"></i>
                        <span className="text-[10px] text-slate-400 mt-1 block">画像を設定</span>
                      </div>
                    )}
                  </div>
                </div>

                <div className="text-xs font-bold text-amber-400 bg-amber-950/80 px-2.5 py-0.5 rounded-full inline-block border border-amber-500/40">
                  【{currentJob.name}】 ({currentJob.tier})
                </div>
                <div className="text-[11px] text-slate-400">{currentJob.desc}</div>

                <div className="text-[11px] text-slate-300 font-mono bg-slate-950/60 py-1 px-2.5 rounded-lg border border-slate-800 inline-block">
                  🏨 滞在: <strong className="text-amber-300">{inn.name}</strong> ({inn.costPerDay} G/日)
                </div>

                <div className="flex justify-center items-center space-x-3 text-xs font-scifi font-bold pt-1">
                  <span className="text-slate-400">総合Rank <strong className={`text-base ${themeText}`}>{overall.rank}</strong></span>
                  <span className={player.gold < 0 ? 'text-red-400' : 'text-amber-300'}>🪙 {player.gold} G</span>
                </div>
              </div>

              {/* 能力値バー */}
              <div className="mt-3 space-y-2">
                {[
                  { name: '筋力 (STR)', val: player.stats.strength, color: 'text-red-400', bar: 'from-red-500 to-amber-500' },
                  { name: '俊敏 (AGI)', val: player.stats.agility, color: 'text-cyan-400', bar: 'from-cyan-500 to-blue-500' },
                  { name: '柔軟 (FEX)', val: player.stats.flexibility, color: 'text-emerald-400', bar: 'from-emerald-500 to-teal-500' },
                  { name: '知力 (INT)', val: player.stats.intelligence, color: 'text-purple-400', bar: 'from-purple-500 to-indigo-500' },
                ].map(s => {
                  const info = getStatRankInfo(s.val);
                  const pct = Math.min(100, Math.floor((s.val / info.cap) * 100));

                  return (
                    <div key={s.name} className="bg-slate-900/80 border border-slate-800 rounded-xl p-2.5 space-y-1.5">
                      <div className="flex justify-between items-center text-xs">
                        <span className={`font-bold ${s.color}`}>{s.name}</span>
                        <div className="flex items-center space-x-1.5 font-mono">
                          <span className="text-white font-bold text-sm">{s.val} / {info.cap}</span>
                          <span className="text-amber-300 font-bold font-scifi">[Rank {info.rank}]</span>
                        </div>
                      </div>
                      <div className="w-full bg-slate-950 h-2 rounded-full overflow-hidden border border-slate-800">
                        <div className={`h-full rounded-full bg-gradient-to-r ${s.bar}`} style={{ width: `${pct}%` }}></div>
                      </div>
                    </div>
                  );
                })}
              </div>

              <button onClick={() => setIsStatusOpen(false)} className="mt-5 w-full py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 font-scifi font-bold">
                CLOSE
              </button>
            </div>
          )}

          {/* 設定モーダル */}
          {isSettingsOpen && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-6">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-xs w-full space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <span className="font-bold text-sm text-white flex items-center space-x-1.5">
                    <i data-lucide="settings" className="w-4 h-4 text-slate-400"></i>
                    <span>環境設定</span>
                  </span>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-2 text-xs">
                  <div className="text-slate-400">データ管理</div>
                  <button 
                    onClick={() => setIsResetConfirmOpen(true)}
                    className="w-full py-2.5 px-3 rounded-xl bg-red-950/80 hover:bg-red-900/80 border border-red-500/50 text-red-300 font-bold text-xs flex items-center justify-center space-x-1.5 transition"
                  >
                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                    <span>データを初期化（リセット）</span>
                  </button>
                </div>

                <button 
                  onClick={() => setIsSettingsOpen(false)}
                  className="w-full py-2 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs hover:bg-slate-700"
                >
                  閉じる
                </button>
              </div>
            </div>
          )}

          {/* 初期化「本当に初期化しますか？」二重確認モーダル */}
          {isResetConfirmOpen && (
            <div className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-6">
              <div className="bg-slate-900 border-2 border-red-500/80 rounded-2xl p-5 max-w-xs w-full text-center space-y-3.5 shadow-2xl animate-fade-in">
                <div className="w-12 h-12 rounded-full bg-red-500/20 text-red-400 border border-red-500/40 flex items-center justify-center mx-auto">
                  <i data-lucide="alert-octagon" className="w-6 h-6"></i>
                </div>
                <h3 className="font-bold text-sm text-white">本当に初期化しますか？</h3>
                <p className="text-xs text-slate-300 leading-relaxed">
                  鍛錬したステータス、所持ゴールド、獲得した称号など、<br/>
                  <strong className="text-red-400">すべての記録が消去され初期状態（見習い冒険者）に戻ります。</strong><br/>
                  この操作は元に戻せません。
                </p>

                <div className="flex space-x-2 pt-1">
                  <button 
                    onClick={() => setIsResetConfirmOpen(false)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs hover:bg-slate-700"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={executeReset}
                    className="flex-1 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-xs shadow-lg shadow-red-900/50"
                  >
                    初期化を実行
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App/>, document.getElementById('root'));
  </script>
</body>
</html>
