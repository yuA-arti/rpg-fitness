    // キャラクター表示コンポーネント
    
    // 4軸レーダーチャート (STR, AGI, STM, INT)
    function RadarChart({ stats, size = 150, isMale = true }) {
      const center = size / 2;
      const radius = size * 0.38;
      
      // 各ステータスの基準最大値を計算 (最小値50、それ以上は現在値の最大値+10に合わせて自動スケーリング)
      const maxStat = Math.max(50, stats.strength || 10, stats.agility || 10, stats.stamina || 10, stats.intelligence || 10) + 10;
      
      const rSTR = ((stats.strength || 10) / maxStat) * radius;
      const rAGI = ((stats.agility || 10) / maxStat) * radius;
      const rSTM = ((stats.stamina || 10) / maxStat) * radius;
      const rINT = ((stats.intelligence || 10) / maxStat) * radius;
      
      // 4軸の座標 (上: STR, 右: AGI, 下: STM, 左: INT)
      const ptSTR = `${center},${center - rSTR}`;
      const ptAGI = `${center + rAGI},${center}`;
      const ptSTM = `${center},${center + rSTM}`;
      const ptINT = `${center - rINT},${center}`;
      const polyPoints = `${ptSTR} ${ptAGI} ${ptSTM} ${ptINT}`;
      
      // 目盛りの多角形 (25%, 50%, 75%, 100%)
      const gridLevels = [0.25, 0.5, 0.75, 1.0];
      
      const strokeColor = isMale ? "#00f0ff" : "#ff4d94";
      const fillColor = isMale ? "rgba(0, 240, 255, 0.35)" : "rgba(255, 77, 148, 0.35)";

      return (
        <div className="relative flex flex-col items-center justify-center p-1 bg-slate-900/80 rounded-2xl border border-slate-800 shadow-inner">
          <div className="text-[10px] font-scifi font-bold text-slate-400 mb-0.5 tracking-wider">ABILITY RADAR</div>
          <svg width={size} height={size} className="overflow-visible">
            {/* グリッド線 */}
            {gridLevels.map((lvl, idx) => {
              const r = radius * lvl;
              return (
                <polygon
                  key={idx}
                  points={`${center},${center - r} ${center + r},${center} ${center},${center + r} ${center - r},${center}`}
                  fill="none"
                  stroke="rgba(148, 163, 184, 0.2)"
                  strokeWidth="1"
                />
              );
            })}
            {/* 軸ライン */}
            <line x1={center} y1={center - radius} x2={center} y2={center + radius} stroke="rgba(148, 163, 184, 0.25)" strokeWidth="1" />
            <line x1={center - radius} y1={center} x2={center + radius} y2={center} stroke="rgba(148, 163, 184, 0.25)" strokeWidth="1" />
            
            {/* 塗りつぶしポリゴン */}
            <polygon points={polyPoints} fill={fillColor} stroke={strokeColor} strokeWidth="2" />
            
            {/* 各頂点マーカー */}
            <circle cx={center} cy={center - rSTR} r="3" fill="#ef4444" />
            <circle cx={center + rAGI} cy={center} r="3" fill="#00f0ff" />
            <circle cx={center} cy={center + rSTM} r="3" fill="#10b981" />
            <circle cx={center - rINT} cy={center} r="3" fill="#c084fc" />
            
            {/* 軸ラベル */}
            <text x={center} y={center - radius - 4} textAnchor="middle" fill="#ef4444" fontSize="8" fontWeight="bold">STR</text>
            <text x={center + radius + 14} y={center + 3} textAnchor="middle" fill="#00f0ff" fontSize="8" fontWeight="bold">AGI</text>
            <text x={center} y={center + radius + 11} textAnchor="middle" fill="#10b981" fontSize="8" fontWeight="bold">STM</text>
            <text x={center - radius - 14} y={center + 3} textAnchor="middle" fill="#c084fc" fontSize="8" fontWeight="bold">INT</text>
          </svg>
        </div>
      );
    }

        </div>
      );

    function App() {

      const [earnedExpEffect, setEarnedExpEffect] = useState(null);

      const [tempName, setTempName] = useState(player.name || 'HERO');
      const [showAreaMap, setShowAreaMap] = useState(false);
      
      // タイマー用State
      const [timerSeconds, setTimerSeconds] = useState(0);
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const timerIntervalRef = useRef(null);

      const [isListening, setIsListening] = useState(false);
      const [voiceFeedback, setVoiceFeedback] = useState('');
      const recognitionRef = useRef(null);

      // 初回または性別未設定なら必ずモーダルを開く
      useEffect(() => {
        if (!player.gender) {
          setIsGenderSelectOpen(true);
        }
      }, [player.gender]);

      useEffect(() => {
        localStorage.setItem('rpg_fitness_player_demon_v18', JSON.stringify(player));
      }, [player]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [selectedPreset, isStatusOpen, isGenderSelectOpen, isLevelUp, stageClearedModal, player]);

      const handleSelectGender = (selectedGender) => {
        setPlayer({
          ...player,
          gender: selectedGender,
        });
        setIsGenderSelectOpen(false);
        if (window.confetti) {
          window.confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
        }
      };

      // 音声認識
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;
        const recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onstart = () => {
          setIsListening(true);
          setVoiceFeedback('「ステータスオープン」または「ステータスクローズ」');
        };
        recognition.onresult = (e) => {
          const text = e.results[e.results.length - 1][0].transcript.trim().toLowerCase();
          setVoiceFeedback(`認識: "${text}"`);
          if (text.includes('クローズ') || text.includes('とじて') || text.includes('閉じて') || text.includes('閉じる') || text.includes('もどる') || text.includes('戻る') || text.includes('close')) {
            setIsStatusOpen(false);
          } else if (text.includes('ステータス') || text.includes('オープン') || text.includes('open')) {
            setIsStatusOpen(true);
          }
        };
        recognition.onend = () => setIsListening(false);
        recognitionRef.current = recognition;
      }, []);

      // タイマーの動作制御
      useEffect(() => {
        if (isTimerRunning) {
          timerIntervalRef.current = setInterval(() => {
            setTimerSeconds(prev => prev + 1);
          }, 1000);
        } else if (timerIntervalRef.current) {
          clearInterval(timerIntervalRef.current);
        }
        return () => {
          if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
        };
      }, [isTimerRunning]);

      const toggleTimer = () => {
        setIsTimerRunning(!isTimerRunning);
      };

      const resetTimer = () => {
        setIsTimerRunning(false);
        setTimerSeconds(0);
      };

      const applyTimerToInput = () => {
        setIsTimerRunning(false);
        const mins = Math.max(1, Math.round(timerSeconds / 60));
        setInputValue(mins);
      };

      const formatTimer = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const toggleListening = () => {
        if (!recognitionRef.current) return;
        if (isListening) {
          recognitionRef.current.stop();
          setIsListening(false);
          setVoiceFeedback('');
        } else {
          try { recognitionRef.current.start(); } catch (e) {}
        }
      };

      const handleSaveName = () => {
        const trimmed = tempName.trim();
        if (trimmed) {
          setPlayer({ ...player, name: trimmed });
        }
        setIsEditingName(false);
      };

      const handleRecord = () => {
        const amount = Number(inputValue);
        if (!amount || amount <= 0) return;

        const baseExp = amount * selectedPreset.expRate;
        let gainedExp = baseExp;
        let earnedGold = Math.max(10, Math.floor(amount * (selectedPreset.expRate / 2)));
        let dailyBonusClaimed = false;

        const todayStr = new Date().toDateString();
        let newDailyDone = player.dailyDone;
        let newStreak = player.streakCount;

        if (player.lastRecordDate !== todayStr) {
          earnedGold += 60;
          gainedExp += 50;
          dailyBonusClaimed = true;
          newDailyDone = true;

          if (player.lastRecordDate) {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            if (player.lastRecordDate === yesterday.toDateString()) {
              newStreak += 1;
            } else {
              newStreak = 1;
            }
          }
        }

        // 運動量に応じた遠征進捗（km換算）
        let rateKm = 0.05;
        if (selectedPreset.category === 'agility') rateKm = 0.15;
        if (selectedPreset.category === 'intelligence') rateKm = 0.06;
        let addedKm = parseFloat((amount * rateKm).toFixed(1));
        const newTraveledKm = parseFloat((player.traveledKm + addedKm).toFixed(1));

        // ステージ踏破判定
        let newlyUnlockedStage = null;
        const updatedCompletedStages = [...player.completedStages];
        let newTitles = [...player.unlockedTitles];
        let stageGoldBonus = 0;

        for (const stage of EXPEDITION_STAGES) {
          if (newTraveledKm >= stage.targetKm && !updatedCompletedStages.includes(stage.id)) {
            updatedCompletedStages.push(stage.id);
            newlyUnlockedStage = stage;
            stageGoldBonus += stage.rewardGold;
            if (stage.title && !newTitles.includes(stage.title)) {
              newTitles.push(stage.title);
            }
          }
        }

        let newLevel = player.level;
        let newExp = player.currentExp + gainedExp;
        let didLevelUp = false;
        while (newExp >= getExpForNextLevel(newLevel)) {
          newExp -= getExpForNextLevel(newLevel);
          newLevel += 1;
          didLevelUp = true;
        }

        const statCategory = selectedPreset.category;
        const statGain = Math.max(1, Math.round(amount * (selectedPreset.expRate / 10)));
        const currentStatVal = (player.stats && player.stats[statCategory]) || 10;

        const newLog = {
          id: Date.now(),
          name: selectedPreset.name,
          amount: amount,
          exp: gainedExp,
          gold: earnedGold,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        const updatedPlayer = {
          ...player,
          level: newLevel,
          currentExp: newExp,
          gold: player.gold + earnedGold + stageGoldBonus,
          traveledKm: newTraveledKm,
          completedStages: updatedCompletedStages,
          unlockedTitles: newTitles,
          streakCount: newStreak,
          lastRecordDate: todayStr,
          dailyDone: newDailyDone,
          stats: { ...player.stats, [statCategory]: currentStatVal + statGain },
          logs: [newLog, ...player.logs.slice(0, 15)]
        };

        setPlayer(updatedPlayer);

        setEarnedExpEffect({ exp: gainedExp, gold: earnedGold, stat: selectedPreset.statName, gain: statGain, daily: dailyBonusClaimed });
        setTimeout(() => setEarnedExpEffect(null), 2800);

        if (didLevelUp) {
          setIsLevelUp(true);
          if (window.confetti) window.confetti({ particleCount: 160, spread: 100, origin: { y: 0.6 } });
        }
        if (newlyUnlockedStage) setStageClearedModal(newlyUnlockedStage);
      };

      const requiredExp = getExpForNextLevel(player.level);
      const expPercent = Math.min(100, Math.floor((player.currentExp / requiredExp) * 100));
      const expeditionPercent = Math.min(100, Math.floor((player.traveledKm / 500) * 100));

      const isMale = (player.gender || 'male') === 'male';
      const themeColor = isMale ? 'text-cyan-400' : 'text-pink-400';
      const themeBorder = isMale ? 'border-cyan-500/40' : 'border-pink-500/40';
      const themeShadow = isMale ? 'shadow-neon-cyan' : 'shadow-neon-pink';

      // 現在進行中のターゲットステージ
      const currentTargetStage = EXPEDITION_STAGES.find(s => player.traveledKm < s.targetKm) || EXPEDITION_STAGES[EXPEDITION_STAGES.length - 1];

      return (
        <div className="max-w-md mx-auto min-h-screen relative flex flex-col justify-between pb-24 shadow-2xl bg-[#090c16] border-x border-slate-800">
          
          {/* ヘッダー */}
          <header className="p-3 border-b border-slate-800 bg-[#0e1222]/90 backdrop-blur sticky top-0 z-20 flex justify-between items-center">
            <div className="flex items-center space-x-2.5">
              <div 
                onClick={() => setIsStatusOpen(true)}
                className={`w-11 h-11 rounded-2xl border flex items-center justify-center cursor-pointer overflow-hidden p-0.5 ${themeBorder} ${themeShadow}`}
              >
                <CharacterVisual gender={player.gender || 'male'} size={42} animated={false} />
              </div>
              <div>
                <div className="flex items-center space-x-2">
                  <span className={`font-scifi text-sm font-black ${themeColor}`}>Lv.{player.level}</span>
                  <span className="text-xs text-amber-300 font-bold font-scifi">🪙 {player.gold} G</span>
                </div>
                <div className="text-[10px] text-slate-400 truncate max-w-[130px]">
                  『{player.activeTitle}』
                </div>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <button onClick={() => setIsGenderSelectOpen(true)} title="キャラクター切替" className="px-2.5 py-1.5 rounded-xl border border-slate-700 bg-slate-800/80 text-slate-300 text-xs font-bold flex items-center space-x-1 hover:text-white">
                <i data-lucide="users" className="w-3.5 h-3.5"></i>
                <span>キャラ切替</span>
              </button>

              <button onClick={toggleListening} className={`p-2 rounded-full border transition-all ${isListening ? 'bg-red-500/20 border-red-500 text-red-400 animate-pulse' : 'bg-slate-800/80 border-slate-700 text-slate-400'}`}>
                <i data-lucide="mic" className="w-4 h-4"></i>
              </button>
            </div>
          </header>

          {voiceFeedback && (
            <div className="mx-4 mt-2 px-3 py-1.5 rounded-lg bg-slate-900/90 border border-slate-700 text-cyan-200 text-xs flex items-center space-x-1.5 z-20">
              <i data-lucide="radio" className="w-3 h-3 text-cyan-400 animate-pulse"></i>
              <span>{voiceFeedback}</span>
            </div>
          )}

          {/* メイン画面 */}
          <main className="p-4 flex-1 space-y-3.5">
            
            {/* ランクEXP ＆ 継続バナー（大アバター削除・すっきり配置） */}
            <div className={`relative rounded-2xl border bg-gradient-to-b from-[#141829] to-[#0d101e] p-3 shadow-lg ${themeBorder} space-y-2`}>
              <div className="flex justify-between items-center">
                <div className="flex items-center space-x-1 text-[11px] text-amber-300 font-bold bg-black/40 px-2.5 py-1 rounded-full border border-amber-400/30">
                  <i data-lucide="flame" className="w-3.5 h-3.5 text-amber-400"></i>
                  <span>{player.streakCount}日連続鍛錬中</span>
                </div>
                <div className="flex items-center space-x-2">
                  <span className="text-[11px] text-slate-400">RANK EXP</span>
                  <span className={`font-scifi font-bold text-xs ${themeColor}`}>{player.currentExp} / {requiredExp} XP</span>
                </div>
              </div>
              <div className="w-full bg-slate-950 h-2 rounded-full p-0.5 border border-slate-800 overflow-hidden">
                <div className={`h-full rounded-full duration-500 ${
                  isMale ? 'bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-400 shadow-neon-cyan' : 'bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 shadow-neon-pink'
                }`} style={{ width: `${expPercent}%` }}></div>
              </div>
            </div>

            {/* 魔王討伐 遠征ルート（全7ステージ一覧・進捗完全可視化） */}
            <div className="bg-slate-900/90 border border-amber-500/30 rounded-2xl p-3.5 space-y-3 shadow-xl">
              <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                <div className="flex items-center space-x-1.5">
                  <i data-lucide="swords" className="w-4 h-4 text-amber-400"></i>
                  <span className="font-bold text-xs text-slate-100 tracking-wider">魔王討伐 遠征ルート</span>
                </div>
                <div className="text-right">
                  <span className="font-scifi text-amber-300 font-black text-sm">{player.traveledKm}</span>
                  <span className="text-[10px] text-slate-400 font-scifi"> / 500 km</span>
                </div>
              </div>

              {/* 全体進行バー */}
              <div>
                <div className="w-full bg-slate-950 h-2 rounded-full overflow-hidden border border-amber-900/50 p-0.5">
                  <div className="h-full bg-gradient-to-r from-amber-500 via-yellow-400 to-red-500 rounded-full transition-all duration-700 shadow-neon-gold" style={{ width: `${expeditionPercent}%` }}></div>
                </div>
                <div className="mt-1 flex justify-between items-center text-[10px]">
                  <span className="text-slate-400">NEXT DESTINATION</span>
                  <span className="text-amber-300 font-bold flex items-center space-x-1">
                    <i data-lucide={currentTargetStage.icon} className="w-3 h-3"></i>
                    <span>{currentTargetStage.name}まで あと {Math.max(0, (currentTargetStage.targetKm - player.traveledKm).toFixed(1))} km</span>
                  </span>
                </div>
              </div>

              {/* 全7ステージのステップ一覧 (プルダウン開閉式) */}
              <div className="pt-1 border-t border-slate-800">
                <button
                  onClick={() => setShowAreaMap(!showAreaMap)}
                  className="w-full flex items-center justify-between text-[11px] text-slate-300 hover:text-amber-300 transition py-1 px-1"
                >
                  <span className="font-bold flex items-center space-x-1">
                    <i data-lucide="map" className="w-3.5 h-3.5 text-amber-400"></i>
                    <span>全エリア進捗マップ (全7領域)</span>
                  </span>
                  <div className="flex items-center space-x-1 text-[10px] text-slate-400 font-bold">
                    <span>{showAreaMap ? '閉じる' : '開く'}</span>
                    <i data-lucide={showAreaMap ? "chevron-up" : "chevron-down"} className="w-3.5 h-3.5"></i>
                  </div>
                </button>

                {showAreaMap && (
                  <div className="mt-2 space-y-1 max-h-48 overflow-y-auto pr-0.5 animate-fade-in">
                    {EXPEDITION_STAGES.map((stage) => {
                      const isPassed = player.traveledKm >= stage.targetKm;
                      const isNext = currentTargetStage.id === stage.id && !isPassed;
                      return (
                        <div 
                          key={stage.id} 
                          className={`flex items-center justify-between p-1.5 rounded-xl border text-xs transition ${
                            isPassed 
                              ? 'bg-amber-950/20 border-amber-500/40 text-amber-200' 
                              : isNext 
                                ? 'bg-cyan-950/40 border-cyan-400 text-white shadow-neon-cyan' 
                                : 'bg-slate-950/40 border-slate-800/60 text-slate-500'
                          }`}
                        >
                          <div className="flex items-center space-x-2">
                            <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${
                              isPassed ? 'bg-amber-500 text-slate-950' : isNext ? 'bg-cyan-400 text-slate-950 animate-pulse' : 'bg-slate-800 text-slate-400'
                            }`}>
                              {isPassed ? '✓' : stage.id}
                            </span>
                            <div>
                              <span className="font-bold text-[11px]">{stage.name}</span>
                              <span className="text-[9px] text-slate-400 ml-1.5 font-mono">({stage.targetKm}km)</span>
                            </div>
                          </div>

                          <div className="text-right">
                            {isPassed ? (
                              <span className="text-[9px] text-amber-400 font-bold bg-amber-950/60 px-1.5 py-0.5 rounded border border-amber-400/30">クリア済</span>
                            ) : isNext ? (
                              <span className="text-[9px] text-cyan-300 font-bold bg-cyan-950/80 px-1.5 py-0.5 rounded border border-cyan-400/40 animate-pulse">
                                あと{(stage.targetKm - player.traveledKm).toFixed(1)}km
                              </span>
                            ) : (
                              <span className="text-[9px] text-slate-600">未到達</span>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>

            {earnedExpEffect && (
              <div className={`fixed top-24 left-1/2 -translate-x-1/2 z-50 bg-black/95 border-2 px-6 py-3 rounded-2xl animate-bounce text-center ${
                isMale ? 'border-cyan-400 shadow-neon-cyan' : 'border-pink-400 shadow-neon-pink'
              }`}>
                <div className={`font-scifi text-xl font-black ${themeColor}`}>+{earnedExpEffect.exp} <span className="text-sm">EXP</span></div>
                <div className="text-xs text-amber-300 font-bold">+{earnedExpEffect.gold} G / {earnedExpEffect.stat} +{earnedExpEffect.gain} 🪙</div>
                {earnedExpEffect.daily && <div className="text-[10px] text-emerald-300 font-bold mt-0.5">🌟 本日のデイリー初回ボーナス！</div>}
              </div>
            )}

            {/* メニュー選択 */}
            <div className="grid grid-cols-2 gap-2 max-h-52 overflow-y-auto pr-0.5">
              {PRESETS.map((p) => {
                const isSelected = selectedPreset.id === p.id;
                return (
                  <button key={p.id} onClick={() => { setSelectedPreset(p); setInputValue(p.defaultVal); }}
                    className={`p-2.5 rounded-xl border transition-all ${isSelected ? (isMale ? 'bg-cyan-950/60 border-cyan-400 shadow-neon-cyan text-white' : 'bg-pink-950/60 border-pink-400 shadow-neon-pink text-white') : 'bg-slate-900/50 border-slate-800/80 text-slate-400 hover:border-slate-700'}`}
                  >
                    <div className="flex items-center space-x-1.5"><i data-lucide={p.icon} className={`w-3.5 h-3.5 ${isSelected ? (isMale ? 'text-cyan-400' : 'text-pink-400') : 'text-slate-500'}`}></i><span className="text-xs font-bold truncate">{p.name}</span></div>
                    <div className="mt-1 flex justify-between items-center text-[10px]"><span className="text-slate-400">{p.statName}</span><span className={`font-scifi font-bold ${themeColor}`}>+{p.expRate}XP</span></div>
                  </button>
                );
              })}
            </div>

            {/* クエストタイマー（読書・勉強・運動の計測） */}
            <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-2.5 flex items-center justify-between shadow-lg">
              <div className="flex items-center space-x-2">
                <div className={`p-2 rounded-xl border ${isTimerRunning ? 'bg-red-500/20 border-red-500 text-red-400 animate-pulse' : 'bg-slate-800/80 border-slate-700 text-cyan-400'}`}>
                  <i data-lucide="timer" className="w-4 h-4"></i>
                </div>
                <div>
                  <div className="text-[10px] text-slate-400 font-bold">QUEST TIMER</div>
                  <div className="font-scifi font-black text-lg text-white tracking-widest leading-tight">
                    {formatTimer(timerSeconds)}
                  </div>
                </div>
              </div>

              <div className="flex items-center space-x-1.5">
                <button
                  onClick={toggleTimer}
                  className={`px-3 py-1.5 rounded-lg font-bold text-xs flex items-center space-x-1 transition shadow ${
                    isTimerRunning 
                      ? 'bg-amber-500 text-slate-950' 
                      : (isMale ? 'bg-cyan-500 text-slate-950' : 'bg-pink-500 text-white')
                  }`}
                >
                  <i data-lucide={isTimerRunning ? "pause" : "play"} className="w-3.5 h-3.5"></i>
                  <span>{isTimerRunning ? "一時停止" : "スタート"}</span>
                </button>

                {timerSeconds > 0 && (
                  <>
                    <button
                      onClick={applyTimerToInput}
                      title="計測時間を入力欄にセット"
                      className="px-2.5 py-1.5 rounded-lg bg-emerald-500/20 border border-emerald-500/50 text-emerald-300 text-xs font-bold hover:bg-emerald-500/30 transition"
                    >
                      反映
                    </button>
                    <button
                      onClick={resetTimer}
                      title="リセット"
                      className="p-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white border border-slate-700 transition"
                    >
                      <i data-lucide="rotate-ccw" className="w-3.5 h-3.5"></i>
                    </button>
                  </>
                )}
              </div>
            </div>

            {/* 記録フォーム */}
            <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-3 space-y-2.5">
              <div className="flex justify-between items-center text-xs">
                <span className="text-slate-300 font-bold">実施量 ({selectedPreset.unit})</span>
                <span className="text-cyan-400 font-mono text-[11px]">
                  獲得予定: <strong className="text-sm text-white">{inputValue * selectedPreset.expRate}</strong> EXP / 
                  <strong className="text-sm text-amber-300 ml-1">{Math.max(10, Math.floor(inputValue * (selectedPreset.expRate / 2)))}</strong> G
                </span>
              </div>
              <div className="flex space-x-2">
                {[10, 20, 30, 50].map((num) => (
                  <button key={num} onClick={() => setInputValue(num)} className="flex-1 py-1 rounded bg-slate-800/60 border border-slate-700 text-xs text-slate-300 hover:border-cyan-400 transition">
                    {num}
                  </button>
                ))}
              </div>
              <div className="flex items-center space-x-2">
                <input type="number" min="1" max="999" value={inputValue} onChange={(e) => setInputValue(Math.max(1, parseInt(e.target.value) || 1))}
                  className="w-24 bg-slate-950 border-2 border-slate-700 rounded-lg py-2 px-2 text-center text-lg font-scifi font-bold text-white focus:outline-none focus:border-cyan-400"
                />
                <button onClick={handleRecord} className={`flex-1 font-black py-2.5 px-3 rounded-lg tracking-wider flex items-center justify-center space-x-1.5 active:scale-95 transition ${
                  isMale ? 'bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 shadow-neon-cyan' : 'bg-gradient-to-r from-pink-500 to-purple-500 text-white shadow-neon-pink'
                }`}>
                  <i data-lucide="check-circle" className="w-4 h-4"></i><span className="text-xs font-scifi">QUEST COMPLETED</span>
                </button>
              </div>
            </div>
          </main>

          {/* 下部固定：「ステータス」 */}
          <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-3 bg-gradient-to-t from-black to-transparent z-20">
            <button onClick={() => setIsStatusOpen(true)} className="w-full relative group overflow-hidden rounded-2xl p-[2px] focus:outline-none shadow-neon-cyan">
              <div className={`absolute inset-0 animate-pulse rounded-2xl ${
                isMale ? 'bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-500 shadow-neon-cyan' : 'bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-400 shadow-neon-pink'
              }`}></div>
              <div className="relative px-6 py-3 rounded-2xl bg-slate-950 flex items-center justify-center space-x-2 transition group-hover:bg-opacity-90">
                <i data-lucide="sparkles" className={`w-5 h-5 animate-bounce ${themeColor}`}></i>
                <span className="font-scifi text-sm font-black tracking-widest text-white">STATUS OPEN</span>
              </div>
            </button>
          </div>

          {/* ① 性別選択モーダル（常時切り替え可能） */}
          {isGenderSelectOpen && (
            <div className="fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl flex flex-col items-center justify-center p-6 animate-fade-in overflow-y-auto">
              <div className="max-w-sm w-full text-center space-y-4">
                <h2 className="font-scifi text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-pink-300">
                  CHOOSE AVATAR
                </h2>
                <p className="text-xs text-slate-300">
                  冒険の相棒となるキャラクターを選択してください。<br/>
                  （※ヘッダーの「キャラ切替」からいつでも変更できます）
                </p>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <div 
                    onClick={() => handleSelectGender('male')}
                    className="p-3 rounded-2xl border-2 border-cyan-500/50 bg-cyan-950/30 hover:bg-cyan-950/60 hover:border-cyan-400 cursor-pointer transition flex flex-col items-center space-y-2 shadow-neon-cyan group"
                  >
                    <div className="w-24 h-24 flex items-center justify-center overflow-hidden rounded-xl bg-slate-900/60 p-1">
                      <img src={BOY_IMAGE} alt="Boy" className="w-full h-full object-contain rounded-lg"/>
                    </div>
                    <div className="font-bold text-sm text-cyan-300">男の子</div>
                    <button className="w-full py-1.5 rounded-lg bg-cyan-500 text-slate-950 font-bold text-xs shadow mt-1 group-hover:scale-105 transition">
                      選択する
                    </button>
                  </div>

                  <div 
                    onClick={() => handleSelectGender('female')}
                    className="p-3 rounded-2xl border-2 border-pink-500/50 bg-pink-950/30 hover:bg-pink-950/60 hover:border-pink-400 cursor-pointer transition flex flex-col items-center space-y-2 shadow-neon-pink group"
                  >
                    <div className="w-24 h-24 flex items-center justify-center overflow-hidden rounded-xl bg-slate-900/60 p-1">
                       <img src={GIRL_IMAGE} alt="Girl" className="w-full h-full object-contain rounded-lg"/>
                    </div>
                    <div className="font-bold text-sm text-pink-300">女の子</div>
                    <button className="w-full py-1.5 rounded-lg bg-pink-500 text-white font-bold text-xs shadow mt-1 group-hover:scale-105 transition">
                      選択する
                    </button>
                  </div>
                </div>

                {player.gender && (
                  <button onClick={() => setIsGenderSelectOpen(false)} className="mt-2 text-xs text-slate-400 hover:text-white">
                    閉じる
                  </button>
                )}
              </div>
            </div>
          )}

          {/* ② ステータス全画面モーダル */}
          {isStatusOpen && (
            <div className="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl flex flex-col p-5 animate-fade-in overflow-y-auto">
              <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                <span className={`font-scifi text-xs tracking-widest ${themeColor}`}>STATUS BOARD</span>
                <button onClick={() => setIsStatusOpen(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-6 h-6"></i></button>
              </div>
              <div className="mt-4 bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center overflow-hidden shadow-neon-cyan">
                <div className="flex justify-center"><CharacterVisual gender={player.gender || 'male'} size={200} animated={true} /></div>
                <div className={`inline-block mt-2 px-3 py-0.5 rounded-full border text-xs font-bold ${
                  isMale ? 'bg-cyan-950/80 border-cyan-500/40 text-cyan-300' : 'bg-pink-950/80 border-pink-500/40 text-pink-300'
                }`}>『{player.activeTitle}』</div>
                <div className="mt-1 flex items-center justify-center space-x-1.5">
                  <h2 className="font-scifi font-black text-xl text-white tracking-wide">{player.name}</h2>
                  <button 
                    onClick={() => { setTempName(player.name); setIsEditingName(true); }}
                    className="p-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-cyan-300 transition"
                    title="名前を変更"
                  >
                    <i data-lucide="edit-3" className="w-3.5 h-3.5"></i>
                  </button>
                </div>
                <div className="text-xs font-scifi text-amber-300 font-bold">RANK: Lv.{player.level} ✦ 🪙 {player.gold} G</div>
              </div>
              <div className="mt-4 grid grid-cols-4 gap-1.5 text-center">
                <div className="bg-slate-900/70 border border-red-900/50 rounded-xl p-2">
                  <div className="text-[10px] text-red-400 font-bold">STR 筋力</div>
                  <div className="font-scifi text-xl font-black text-white mt-0.5">{player.stats.strength}</div>
                </div>
                <div className="bg-slate-900/70 border border-blue-900/50 rounded-xl p-2">
                  <div className="text-[10px] text-cyan-400 font-bold">AGI 敏捷</div>
                  <div className="font-scifi text-xl font-black text-white mt-0.5">{player.stats.agility}</div>
                </div>
                <div className="bg-slate-900/70 border border-emerald-900/50 rounded-xl p-2">
                  <div className="text-[10px] text-emerald-400 font-bold">STM 柔軟</div>
                  <div className="font-scifi text-xl font-black text-white mt-0.5">{player.stats.stamina}</div>
                </div>
                <div className="bg-slate-900/70 border border-purple-900/50 rounded-xl p-2">
                  <div className="text-[10px] text-purple-300 font-bold">INT 知力</div>
                  <div className="font-scifi text-xl font-black text-purple-200 mt-0.5">{player.stats.intelligence || 10}</div>
                </div>
              </div>

              {/* 獲得称号 ＆ レーダーチャートの横並びエリア */}
              <div className="mt-4 grid grid-cols-2 gap-2.5 items-start pb-20">
                {/* 左側：称号一覧 */}
                <div className="space-y-1.5 bg-slate-900/60 p-2.5 rounded-2xl border border-slate-800 h-full flex flex-col justify-between">
                  <div>
                    <div className="text-[11px] font-bold text-amber-300 tracking-wider flex items-center space-x-1 mb-1.5">
                      <i data-lucide="award" className="w-3.5 h-3.5"></i>
                      <span>獲得称号</span>
                    </div>
                    <div className="flex flex-col gap-1 max-h-40 overflow-y-auto pr-0.5">
                      {player.unlockedTitles.map((title) => (
                        <button
                          key={title}
                          onClick={() => setPlayer({ ...player, activeTitle: title })}
                          className={`text-[10px] text-left px-2 py-1 rounded-lg border transition truncate ${
                            player.activeTitle === title 
                              ? (isMale ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300 font-bold shadow-neon-cyan' : 'bg-pink-500/20 border-pink-400 text-pink-300 font-bold shadow-neon-pink')
                              : 'bg-slate-900/70 border-slate-800 text-slate-400 hover:border-slate-700'
                          }`}
                        >
                          {title}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="text-[9px] text-slate-500 text-center pt-1 border-t border-slate-800/80">タップでセット</div>
                </div>

                {/* 右側：レーダーチャート */}
                <RadarChart stats={player.stats} size={135} isMale={isMale} />
              </div>
              <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-gradient-to-t from-black to-transparent">
                  <button onClick={() => setIsStatusOpen(false)} className="w-full py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 font-scifi font-bold transition hover:text-white">CLOSE Interface</button>
              </div>

              {/* 名前変更ダイアログ */}
              {isEditingName && (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                  <div className="bg-slate-900 border border-cyan-500/50 rounded-2xl p-5 w-full max-w-xs space-y-4 shadow-neon-cyan">
                    <div className="text-center">
                      <div className="font-scifi text-sm font-bold text-cyan-300">CHANGE NAME</div>
                      <p className="text-[11px] text-slate-400 mt-1">冒険者の新しい名前を入力してください</p>
                    </div>
                    <input 
                      type="text" 
                      maxLength="12"
                      value={tempName} 
                      onChange={(e) => setTempName(e.target.value)}
                      placeholder="名前を入力"
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-center text-sm font-bold text-white focus:outline-none focus:border-cyan-400"
                    />
                    <div className="flex space-x-2">
                      <button 
                        onClick={() => setIsEditingName(false)}
                        className="flex-1 py-2 rounded-xl bg-slate-800 text-xs font-bold text-slate-300 hover:bg-slate-700"
                      >
                        キャンセル
                      </button>
                      <button 
                        onClick={handleSaveName}
                        className="flex-1 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-500 text-xs font-bold text-slate-950 shadow-neon-cyan"
                      >
                        変更する
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ③ チェックポイント到達モーダル */}
          {stageClearedModal && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-6 animate-fade-in">
              <div className="text-center space-y-4 max-w-sm">
                <i data-lucide="shield-check" className="w-12 h-12 text-amber-300 animate-bounce mx-auto"></i>
                <div className="space-y-1">
                  <span className="text-xs text-amber-400 font-mono tracking-widest">AREA CLEARED!</span>
                  <h3 className="text-xl font-bold text-white">{stageClearedModal.name} 突破！</h3>
                </div>
                <div className="bg-slate-900/90 border border-amber-500/40 rounded-2xl p-4 shadow-neon-gold space-y-2 text-xs">
                  <p className="text-slate-300">魔王軍の警戒網を突破し、次の領域へ進軍しました！</p>
                  <div className="text-amber-400 font-bold text-sm">踏破報酬: 🪙 +{stageClearedModal.rewardGold} G</div>
                  {stageClearedModal.title && <div className="text-cyan-300">獲得称号: 『{stageClearedModal.title}』</div>}
                </div>
                <button onClick={() => setStageClearedModal(null)} className="w-full py-3 rounded-xl bg-amber-500 text-slate-950 font-bold shadow-neon-gold">進軍を続ける</button>
              </div>
            </div>
          )}

          {/* ④ レベルアップモーダル */}
          {isLevelUp && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-6 animate-fade-in">
              <div className="text-center space-y-4 max-w-sm">
                <i data-lucide="crown" className={`w-14 h-14 animate-bounce mx-auto ${themeColor}`}></i>
                <div className="font-scifi text-4xl font-black text-white">LEVEL UP!</div>
                <div className={`${themeColor} font-bold text-sm`}>RANK: Lv.{player.level} ✦ 全ステータス上昇！</div>
                <button onClick={() => setIsLevelUp(false)} className={`w-full py-3.5 rounded-xl font-bold ${isMale ? 'bg-cyan-400 text-slate-950 shadow-neon-cyan' : 'bg-pink-500 text-white shadow-neon-pink'}`}>OK</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App/>, document.getElementById('root'));
  </script>
</body>
</html>
