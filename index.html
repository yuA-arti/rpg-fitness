    const RANK_THRESHOLDS = [
      { rank: 'F', min: 0, max: 9, cap: 10 },
      { rank: 'E', min: 10, max: 24, cap: 25 },
      { rank: 'D', min: 25, max: 49, cap: 50 },
      { rank: 'C', min: 50, max: 79, cap: 80 },
      { rank: 'B', min: 80, max: 119, cap: 120 },
      { rank: 'A', min: 120, max: 169, cap: 170 },
      { rank: 'S', min: 170, max: 99999, cap: 200 },
    ];

    function getStatRankInfo(val) {
      for (let i = RANK_THRESHOLDS.length - 1; i >= 0; i--) {
        if (val >= RANK_THRESHOLDS[i].min) return RANK_THRESHOLDS[i];
      }
      return RANK_THRESHOLDS[0];
    }

    function calculateOverallRank(stats) {
      const vals = [stats.strength || 0, stats.agility || 0, stats.flexibility || 0, stats.intelligence || 0].sort((a, b) => b - a);
      const top2Avg = (vals[0] + vals[1]) / 2;
      return { rank: getStatRankInfo(top2Avg).rank, avgVal: Math.round(top2Avg) };
    }

    function determineJob(stats) {
      const statList = [
        { key: 'strength', name: '筋力', val: stats.strength || 0 },
        { key: 'agility', name: '俊敏', val: stats.agility || 0 },
        { key: 'flexibility', name: '柔軟', val: stats.flexibility || 0 },
        { key: 'intelligence', name: '知力', val: stats.intelligence || 0 },
      ].sort((x, y) => y.val - x.val);

      const top1 = statList[0];
      const top2 = statList[1];
      const avgTop2 = (top1.val + top2.val) / 2;

      if (avgTop2 < 25) {
        return { name: '見習い冒険者', tier: '見習い', desc: '街の雑用や基礎体力を鍛える駆け出し冒険者' };
      }

      const isHighTier = avgTop2 >= 80;
      const isDual = (top1.val - top2.val) <= 15;

      if (isDual) {
        const combo = [top1.key, top2.key].sort().join('+');
        switch(combo) {
          case 'agility+strength':
            return isHighTier ? { name: '拳聖', tier: '上級職', desc: '気功と連撃を極めた体術の頂点' } : { name: '武闘家', tier: '基本職', desc: '拳と蹴りの速射で圧倒する格闘家' };
          case 'flexibility+strength':
            return isHighTier ? { name: '聖騎士', tier: '上級職', desc: '衝撃を受け流す体幹と神聖な護りを宿す鉄壁の盾' } : { name: '重装騎士', tier: '基本職', desc: '頑強な鎧と筋力で前線を支える騎士' };
          case 'agility+flexibility':
            return isHighTier ? { name: '忍者', tier: '上級職', desc: '神出鬼没の身のこなしで死角を制する達人' } : { name: '忍び', tier: '基本職', desc: '身軽さと柔軟さで敵を惑わす下忍' };
          case 'intelligence+strength':
            return isHighTier ? { name: '魔剣士', tier: '上級職', desc: '剣技に高位魔法を宿して戦う文武両道の花形' } : { name: '魔法戦士', tier: '基本職', desc: '剣と基礎魔法を器用に操る万能戦士' };
          case 'agility+intelligence':
            return isHighTier ? { name: '狙撃手', tier: '上級職', desc: '風と弾道を完璧に読み急所を射抜くスナイパー' } : { name: '弓使い', tier: '基本職', desc: '状況判断と素早い矢の装填で援護する射手' };
          case 'flexibility+intelligence':
            return isHighTier ? { name: 'ネクロマンサー', tier: '上級職', desc: '深淵の知恵と異界の気配を受け流す死霊術士' } : { name: '呪術師', tier: '基本職', desc: '霊的な気配を読みデバフを操る術士' };
          default:
            break;
        }
      }

      switch(top1.key) {
        case 'strength':
          return isHighTier ? { name: '狂戦士', tier: '上級職', desc: '理性を超越した腕力で全てを叩き割る破壊神' } : { name: '戦士', tier: '基本職', desc: '剛腕で武器を振るう前衛の基本職' };
        case 'agility':
          return isHighTier ? { name: 'アサシン', tier: '上級職', desc: '音もなく間合いを詰め急所を一撃で断つ暗殺者' } : { name: '軽戦士', tier: '基本職', desc: '素早さと手数の多さで優位に立つ身軽な戦士' };
        case 'flexibility':
          return isHighTier ? { name: '幻影士', tier: '上級職', desc: '関節の柔らかさで残像すら惑わせる回避の達人' } : { name: '道化師', tier: '基本職', desc: 'しなやかな動きで敵の攻撃をことごとく躱すトリックスター' };
        case 'intelligence':
          return isHighTier ? { name: '大魔導士', tier: '上級職', desc: '世界の理を解き広域属性魔法を放つ大賢者' } : { name: '魔導士', tier: '基本職', desc: '知識と分析で敵の弱点を突く呪術士' };
        default:
          return { name: '冒険者', tier: '基本職', desc: '未知なる世界へ挑む者' };
      }
    }

    function getDailyAvailableQuests(dayTimestamp) {
      const date = new Date(dayTimestamp);
      const dayNum = Math.floor(date.getTime() / (1000 * 60 * 60 * 24));
      const ranks = ['F', 'E', 'D', 'C', 'B', 'A', 'S'];
      const result = [];

      ranks.forEach(r => {
        const questsInRank = ALL_GUILD_QUESTS.filter(q => q.rank === r);
        if (questsInRank.length === 0) return;

        if (r === 'F') {
          result.push(...questsInRank);
        } else {
          const primaryIdx = Math.abs(dayNum) % questsInRank.length;
          result.push(questsInRank[primaryIdx]);

          questsInRank.forEach((q, idx) => {
            if (idx !== primaryIdx) {
              const hash = (dayNum * 19 + q.id.charCodeAt(0) * 11 + idx * 7) % 100;
              if (hash < 50) {
                result.push(q);
              }
            }
          });
        }
      });

      return result;
    }

    const INITIAL_PLAYER_DATA = {

    function App() {
      const [player, setPlayer] = useState(() => {
        const saved = localStorage.getItem('rpg_fitness_player_guild_v19');
        return saved ? JSON.parse(saved) : INITIAL_PLAYER_DATA;
      });

      const [activeTab, setActiveTab] = useState('train');

      const [isNameEditOpen, setIsNameEditOpen] = useState(false);
      const [tempName, setTempName] = useState(player.name || 'HERO');
      const [selectedRankTab, setSelectedRankTab] = useState('F');

      const [cheatWarningNotice, setCheatWarningNotice] = useState(null);

      // クレアの衰退予兆警告モーダル (3日サボり)

      const [isCheatAuthOpen, setIsCheatAuthOpen] = useState(false);
      const [cheatPassword, setCheatPassword] = useState('');
      const [cheatError, setCheatError] = useState(false);
      const [isCheatPanelOpen, setIsCheatPanelOpen] = useState(false);

      const [timerSeconds, setTimerSeconds] = useState(0);
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const timerIntervalRef = useRef(null);
      const fileInputRef = useRef(null);

      const overall = calculateOverallRank(player.stats);
      const currentJob = determineJob(player.stats);
      const inn = getInnInfo(currentJob.tier);

      // 日付変更チェック（3日目：クレアの衰退警告 / 4日目以降：ステータス減少）
      useEffect(() => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const todayTime = today.getTime();

        if (player.lastActiveDate) {
          const lastDate = new Date(player.lastActiveDate);
          lastDate.setHours(0, 0, 0, 0);
          const diffDays = Math.floor((todayTime - lastDate.getTime()) / (1000 * 60 * 60 * 24));

          if (diffDays >= 1) {
            const cost = diffDays * inn.costPerDay;
            const newGold = player.gold - cost;
            const camping = newGold < 0;

            const newStats = { ...player.stats };
            const warningStats = []; // 3日放置の衰退警告リスト
            const decayedStats = []; // 4日以上放置で実際に減少したリスト

            const statNameMap = { strength: '筋力', agility: '俊敏', flexibility: '柔軟', intelligence: '知力' };

            ['strength', 'agility', 'flexibility', 'intelligence'].forEach(k => {
              if (player.lastTrainedDates[k]) {
                const td = new Date(player.lastTrainedDates[k]);
                td.setHours(0, 0, 0, 0);
                const idleDays = Math.floor((todayTime - td.getTime()) / (1000 * 60 * 60 * 24));

                // 3日目の予兆警告（数値は減らさない）
                if (idleDays === 3) {
                  warningStats.push(statNameMap[k]);
                }
                // 4日目以降の実減少（4日目で-1、5日目で-2……）
                else if (idleDays >= 4) {
                  const decayAmount = idleDays - 3;
                  const prevVal = newStats[k] || 0;
                  newStats[k] = Math.max(0, prevVal - decayAmount);
                  decayedStats.push({ name: statNameMap[k], amount: decayAmount, current: newStats[k] });
                }
              }
            });

            const newStreak = diffDays === 1 ? (player.streakCount || 1) + 1 : 1;

            setPlayer(prev => ({
              ...prev,
              gold: newGold,
              stats: newStats,
              streakCount: newStreak,
              lastActiveDate: todayTime,
              dailyClearedQuests: [],
              isCamping: camping
            }));

            // 宿代モーダル
            setInnBillNotice({
              innId: inn.id,
              innName: inn.name,
              keeperName: inn.keeperName,
              cost,
              days: diffDays,
              remainingGold: newGold,
              isCamping: camping,
              speech: camping ? inn.getCampSpeech(player.name) : inn.getNormalSpeech(player.name, diffDays, cost)
            });

            // 3日放置の予兆警告、または4日以上の減少警告をクレアから通知
            if (warningStats.length > 0 || decayedStats.length > 0) {
              setDecayWarningNotice({
                warningList: warningStats,
                decayedList: decayedStats
              });
            }
          }
        } else {
          setPlayer(prev => ({ ...prev, lastActiveDate: todayTime }));
        }

      useEffect(() => {

          timerIntervalRef.current = setInterval(() => setTimerSeconds(p => p + 1), 1000);
        } else if (timerIntervalRef.current) {
          clearInterval(timerIntervalRef.current);

      const formatTimer = (sec) => {

      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 300;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_SIZE) {
                height = Math.round((height * MAX_SIZE) / width);
                width = MAX_SIZE;
              }
            } else {
              if (height > MAX_SIZE) {
                width = Math.round((width * MAX_SIZE) / height);
                height = MAX_SIZE;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
            setPlayer(prev => ({ ...prev, customAvatar: compressedDataUrl }));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleSaveName = () => {
        const trimmed = tempName.trim();
        if (trimmed) {
          setPlayer(prev => ({ ...prev, name: trimmed }));

        setIsNameEditOpen(false);
      };

      const executeReset = () => {
        localStorage.removeItem('rpg_fitness_player_guild_v19');
        setPlayer(INITIAL_PLAYER_DATA);
        setIsResetConfirmOpen(false);
        setIsSettingsOpen(false);

      };

      const handleVerifyCheatPassword = () => {
        if (cheatPassword === '0523') {

          setCheatPassword('');
          setIsCheatAuthOpen(false);
          setIsCheatPanelOpen(true);

      };

      const applyCheatStat = (statKey, addVal) => {
        setPlayer(prev => ({
          ...prev,
          stats: {
            ...prev.stats,
            [statKey]: addVal === 0 ? 0 : Math.max(0, (prev.stats[statKey] || 0) + addVal)

      };

      const applyCheatGold = (addGold) => {
        setPlayer(prev => ({
          ...prev,
          gold: Math.max(0, prev.gold + addGold),
          isCamping: false

      };

      const applyCheatStreak = (addDays) => {
        setPlayer(prev => ({
          ...prev,
          streakCount: Math.max(1, (prev.streakCount || 1) + addDays)
        }));
      };

      // 鍛錬記録（サボりカウントも同時に0日へリセット）
      const handleRecord = () => {
        const amount = Number(inputValue);
        if (!amount || amount <= 0) return;

        if (amount > selectedPreset.limit) {
          setCheatWarningNotice({
            taskName: selectedPreset.name,
            amount: amount,
            unit: selectedPreset.unit,
            limit: selectedPreset.limit
          });
          return;
        }

        let gained = Math.max(1, Math.round((amount / selectedPreset.stepVal) * selectedPreset.gain));
        if (player.isCamping) gained = Math.max(1, Math.floor(gained * 0.5));

        const cat = selectedPreset.category;
        const nextVal = (player.stats[cat] || 0) + gained;
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        setPlayer(prev => ({
          ...prev,
          stats: { ...prev.stats, [cat]: nextVal },
          lastTrainedDates: { ...prev.lastTrainedDates, [cat]: today.getTime() }
        }));

        if (window.confetti) window.confetti({ particleCount: 70, spread: 60, origin: { y: 0.7 } });
      };

      const handleAttemptQuest = (quest) => {
        const clearedList = player.dailyClearedQuests || [];
        if (clearedList.includes(quest.id)) {
          setBlockedNotice({
            type: 'cleared',
            title: '本日達成済みです',
            claireSpeech: `「${player.name}さん、こちらの依頼は本日すでに達成済みですよ！また明日新しい依頼が届きますので、楽しみに待っていてくださいね。」`
          });
          return;
        }

        const curStreak = player.streakCount || 1;
        if (quest.reqStreak && curStreak < quest.reqStreak) {
          const diff = quest.reqStreak - curStreak;
          setBlockedNotice({
            type: 'streak',
            title: 'ギルドの信用不足です',
            claireSpeech: `「${player.name}さん、ごめんなさい……！この依頼はとても危険なので、ギルドの規定で継続鍛錬が【${quest.reqStreak}日】以上必要なの。あと【${diff}日】鍛錬を続けてくれたら、私が責任を持って推薦しますからね！一緒に頑張りましょう！」`
          });
          return;
        }

        let isSuccess = true;
        const details = [];
        const statNameMap = { strength: '筋力', agility: '俊敏', flexibility: '柔軟', intelligence: '知力' };

        for (let k in quest.reqStats) {
          const req = quest.reqStats[k];
          const cur = player.stats[k] || 0;
          const passed = cur >= req;
          if (!passed) isSuccess = false;
          details.push({
            name: statNameMap[k],
            current: cur,
            required: req,
            diff: req - cur,
            passed: passed,
            failAdvice: quest.failLogs[k]
          });
        }

        if (isSuccess) {
          const newGold = player.gold + quest.rewardGold;
          const wasCamping = player.isCamping;
          const nowCamping = newGold < 0;

          const updatedTitles = [...player.unlockedTitles];
          if (quest.rewardTitle && !updatedTitles.includes(quest.rewardTitle)) {
            updatedTitles.push(quest.rewardTitle);
          }

          const newDailyCleared = [...clearedList, quest.id];

          setPlayer(prev => ({
            ...prev,
            gold: newGold,
            unlockedTitles: updatedTitles,
            dailyClearedQuests: newDailyCleared,
            isCamping: nowCamping
          }));

            </div>
          )}

          {/* 宿屋支払いモーダル */}
          {innBillNotice && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex items-center justify-center p-5 animate-fade-in">
              <div className={`bg-slate-900 border-2 rounded-3xl p-5 max-w-xs w-full space-y-3.5 shadow-2xl text-center ${
                innBillNotice.isCamping ? 'border-red-500/80' : 'border-amber-500/60 shadow-neon-gold'
              }`}>
                <div className="flex justify-center">
                  {innBillNotice.innId === 'cheap' && <InnOldManPixel size={64} />}
                  {innBillNotice.innId === 'normal' && <InnGirlPixel size={64} />}
                  {innBillNotice.innId === 'luxury' && <InnButlerPixel size={64} />}
                </div>

                <div className="space-y-1">
                  <div className="text-[10px] font-bold text-amber-300 bg-amber-950/80 px-2.5 py-0.5 rounded-full inline-block border border-amber-500/30">
                    {innBillNotice.innName}
                  </div>
                  <h3 className="font-bold text-sm text-white">{innBillNotice.keeperName}</h3>
                </div>

                <div className="bg-slate-950/85 p-3 rounded-2xl border border-slate-800 text-left">
                  <p className="text-xs text-slate-200 leading-relaxed font-medium">
                    {innBillNotice.speech}
                  </p>
                </div>

                <div className="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80 text-xs font-mono space-y-1">
                  <div className="flex justify-between text-slate-400">
                    <span>滞在期間:</span>
                    <span className="text-white font-bold">{innBillNotice.days} 日分</span>
                  </div>
                  <div className="flex justify-between text-slate-400">
                    <span>お支払い:</span>
                    <span className="text-red-400 font-bold">-{innBillNotice.cost} G</span>
                  </div>
                  <div className="flex justify-between border-t border-slate-800 pt-1 text-slate-300">
                    <span>所持金残高:</span>
                    <span className={`font-bold ${innBillNotice.remainingGold < 0 ? 'text-red-400 animate-pulse' : 'text-amber-300'}`}>
                      🪙 {innBillNotice.remainingGold} G
                    </span>
                  </div>
                </div>

                <button 
                  onClick={() => setInnBillNotice(null)} 
                  className={`w-full py-2.5 rounded-xl font-bold text-xs shadow transition active:scale-95 ${
                    innBillNotice.isCamping ? 'bg-red-600 text-white' : 'bg-amber-500 text-slate-950'
                  }`}
                >
                  {innBillNotice.isCamping ? '外へ出る（野宿）' : '出発する'}
                </button>
              </div>
            </div>
          )}

          {/* 判定結果モーダル */}
          {questResultModal && (
            <div className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-5">
              <div className={`bg-slate-900 border-2 rounded-2xl p-5 max-w-sm w-full space-y-3 ${
                questResultModal.success ? 'border-amber-400 shadow-neon-gold' : 'border-red-500/60'
              }`}>
                <div className="text-center">
                  <div className="text-2xl">{questResultModal.success ? '⚔️' : '❌'}</div>
                  <h3 className={`font-bold text-base ${questResultModal.success ? 'text-amber-300' : 'text-red-400'}`}>
                    {questResultModal.success ? 'ミッション達成！' : 'ミッション失敗……！'}
                  </h3>
                  <div className="text-xs text-slate-300 font-bold mt-0.5">{questResultModal.quest.name}</div>
                </div>

                <div className="space-y-1 bg-slate-950/70 p-3 rounded-xl border border-slate-800 text-xs font-mono">
                  {questResultModal.details.map((d, i) => (
                    <div key={i} className="flex justify-between items-center py-0.5">
                      <span className="text-slate-300">{d.name}</span>
                      <span className={d.passed ? 'text-emerald-400 font-bold' : 'text-red-400 font-bold'}>
                        {d.current} / {d.required} ({d.passed ? 'クリア' : `あと ${d.diff} 不足`})
                      </span>
                    </div>
                  ))}
                </div>

                {questResultModal.success ? (
                  <div className="p-2.5 rounded-xl bg-amber-950/40 border border-amber-500/30 text-xs text-amber-200">
                    <div>🪙 報奨獲得: +{questResultModal.quest.rewardGold} G</div>
                    {questResultModal.quest.rewardTitle && <div>🎖️ 新称号: 『{questResultModal.quest.rewardTitle}』</div>}
                  </div>
                ) : (
                  <div className="p-2.5 rounded-xl bg-red-950/40 border border-red-500/30 text-xs text-red-200 space-y-1">
                    {questResultModal.details.filter(d => !d.passed).map((d, i) => (
                      <div key={i} className="text-[11px]">• {d.failAdvice}</div>
                    ))}
                  </div>
                )}

                <button onClick={() => setQuestResultModal(null)} className="w-full py-2.5 rounded-xl font-bold text-xs bg-slate-800 text-slate-200">
                  閉じる
                </button>
              </div>
            </div>
          )}

          {/* ステータス全画面モーダル */}
          {isStatusOpen && (
            <div className="fixed inset-0 z-50 bg-black/95 flex flex-col p-5 overflow-y-auto">
              <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                <span className={`font-scifi text-xs ${themeText}`}>STATUS INTERFACE</span>
                <div className="flex items-center space-x-3">
                  <button 
                    onClick={() => setIsSettingsOpen(true)} 
                    title="設定"
                    className="p-1.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-400 hover:text-white hover:border-slate-500 transition"
                  >
                    <i data-lucide="settings" className="w-4 h-4"></i>
                  </button>
                  <button onClick={() => setIsStatusOpen(false)} className="text-slate-400 hover:text-white text-lg font-bold">✕</button>
                </div>
              </div>

              <div className="mt-3 bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center space-y-2">
                <div className="flex justify-center">
                  <div 
                    onClick={() => fileInputRef.current.click()}
                    className={`w-28 h-28 rounded-2xl border-2 overflow-hidden bg-slate-950 flex items-center justify-center cursor-pointer ${themeBorder} ${themeShadow}`}
                  >
                    {player.customAvatar ? (
                      <img src={player.customAvatar} alt="Avatar" className="w-full h-full object-cover" />
                    ) : (
                      <div className="text-center p-2">
                        <i data-lucide="image-plus" className="w-7 h-7 text-slate-500 mx-auto"></i>
                        <span className="text-[10px] text-slate-400 mt-1 block">画像を設定</span>
                      </div>
                    )}
                  </div>
                </div>

                <div className="flex items-center justify-center space-x-1.5">
                  <span className="font-scifi font-black text-xl text-white tracking-wide">{player.name}</span>
                  <button 
                    onClick={() => { setTempName(player.name); setIsNameEditOpen(true); }}
                    className="p-1 rounded-lg bg-slate-800 text-slate-400 hover:text-cyan-300 transition"
                    title="名前を変更"
                  >
                    <i data-lucide="edit-3" className="w-3.5 h-3.5"></i>
                  </button>
                </div>

                <div className="text-xs font-bold text-amber-400 bg-amber-950/80 px-2.5 py-0.5 rounded-full inline-block border border-amber-500/40">
                  【{currentJob.name}】 ({currentJob.tier})
                </div>
                <div className="text-[11px] text-slate-400">{currentJob.desc}</div>

                <div className="text-[11px] text-slate-300 font-mono bg-slate-950/60 py-1 px-2.5 rounded-lg border border-slate-800 inline-block">
                  🏨 滞在: <strong className="text-amber-300">{inn.name}</strong> ({inn.costPerDay} G/日)
                </div>

                <div className="flex justify-center items-center space-x-3 text-xs font-scifi font-bold pt-1">
                  <span className="text-slate-400">総合Rank <strong className={`text-base ${themeText}`}>{overall.rank}</strong></span>
                  <span className={player.gold < 0 ? 'text-red-400' : 'text-amber-300'}>🪙 {player.gold} G</span>
                </div>
              </div>

              {/* 能力値バー（3日以上サボっている項目に警告表示） */}
              <div className="mt-3 space-y-2">
                {[
                  { key: 'strength', name: '筋力 (STR)', val: player.stats.strength, color: 'text-red-400', bar: 'from-red-500 to-amber-500' },
                  { key: 'agility', name: '俊敏 (AGI)', val: player.stats.agility, color: 'text-cyan-400', bar: 'from-cyan-500 to-blue-500' },
                  { key: 'flexibility', name: '柔軟 (FEX)', val: player.stats.flexibility, color: 'text-emerald-400', bar: 'from-emerald-500 to-teal-500' },
                  { key: 'intelligence', name: '知力 (INT)', val: player.stats.intelligence, color: 'text-purple-400', bar: 'from-purple-500 to-indigo-500' },
                ].map(s => {
                  const info = getStatRankInfo(s.val);
                  const pct = Math.min(100, Math.floor((s.val / info.cap) * 100));
                  const idle = getIdleDays(s.key);

                  return (
                    <div key={s.name} className="bg-slate-900/80 border border-slate-800 rounded-xl p-2.5 space-y-1.5">
                      <div className="flex justify-between items-center text-xs">
                        <div className="flex items-center space-x-1.5">
                          <span className={`font-bold ${s.color}`}>{s.name}</span>
                          {idle >= 3 && (
                            <span className="text-[9px] bg-red-950/80 text-red-300 border border-red-500/50 px-1 rounded animate-pulse">
                              ⚠️{idle >= 4 ? '衰退中' : '衰退予兆'}
                            </span>
                          )}
                        </div>
                        <div className="flex items-center space-x-1.5 font-mono">
                          <span className="text-white font-bold text-sm">{s.val} / {info.cap}</span>
                          <span className="text-amber-300 font-bold font-scifi">[Rank {info.rank}]</span>
                        </div>
                      </div>
                      <div className="w-full bg-slate-950 h-2 rounded-full overflow-hidden border border-slate-800">
                        <div className={`h-full rounded-full bg-gradient-to-r ${s.bar}`} style={{ width: `${pct}%` }}></div>
                      </div>
                    </div>
                  );
                })}
              </div>

              <button onClick={() => setIsStatusOpen(false)} className="mt-5 w-full py-3 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 font-scifi font-bold">
                CLOSE
              </button>
            </div>
          )}

          {/* 名前変更モーダル */}
          {isNameEditOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-5 animate-fade-in">
              <div className="bg-slate-900 border border-cyan-500/50 rounded-2xl p-5 w-full max-w-xs space-y-4 shadow-neon-cyan">
                <div className="text-center">
                  <div className="font-scifi text-sm font-bold text-cyan-300">CHANGE NAME</div>
                  <p className="text-[11px] text-slate-400 mt-1">冒険者の名前を入力してください</p>
                </div>
                <input 
                  type="text" 
                  maxLength="12"
                  value={tempName} 
                  onChange={(e) => setTempName(e.target.value)}
                  placeholder="名前を入力"
                  className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-center text-sm font-bold text-white focus:outline-none focus:border-cyan-400"
                />
                <div className="flex space-x-2">
                  <button onClick={() => setIsNameEditOpen(false)} className="flex-1 py-2 rounded-xl bg-slate-800 text-xs font-bold text-slate-300 hover:bg-slate-700">
                    キャンセル
                  </button>
                  <button onClick={handleSaveName} className="flex-1 py-2 rounded-xl bg-cyan-500 text-xs font-bold text-slate-950 shadow">
                    決定
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 設定モーダル */}
          {isSettingsOpen && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-6">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-xs w-full space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <span className="font-bold text-sm text-white flex items-center space-x-1.5">
                    <i data-lucide="settings" className="w-4 h-4 text-slate-400"></i>
                    <span>環境設定</span>
                  </span>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-2 text-xs">
                  <div className="text-slate-400">開発者・デバッグ管理</div>
                  <button 
                    onClick={() => {
                      setIsSettingsOpen(false);
                      setIsCheatAuthOpen(true);
                    }}
                    className="w-full py-2.5 px-3 rounded-xl bg-amber-950/80 hover:bg-amber-900/80 border border-amber-500/60 text-amber-300 font-bold text-xs flex items-center justify-center space-x-1.5 transition shadow"
                  >
                    <i data-lucide="zap" className="w-4 h-4 text-amber-400"></i>
                    <span>チート（リミッター解除）</span>
                  </button>

                  <div className="text-slate-400 pt-2">データ管理</div>
                  <button 
                    onClick={() => setIsResetConfirmOpen(true)}
                    className="w-full py-2.5 px-3 rounded-xl bg-red-950/80 hover:bg-red-900/80 border border-red-500/50 text-red-300 font-bold text-xs flex items-center justify-center space-x-1.5 transition"
                  >
                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                    <span>データを初期化（リセット）</span>
                  </button>
                </div>

                <button 
                  onClick={() => setIsSettingsOpen(false)}
                  className="w-full py-2 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs hover:bg-slate-700"
                >
                  閉じる
                </button>
              </div>
            </div>
          )}

          {/* チート認証モーダル */}
          {isCheatAuthOpen && (
            <div className="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex items-center justify-center p-5 animate-fade-in">
              <div className="bg-slate-900 border-2 border-amber-500/70 rounded-3xl p-5 max-w-xs w-full space-y-4 shadow-2xl text-center">
                <div className="w-12 h-12 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/50 flex items-center justify-center mx-auto">
                  <i data-lucide="key" className="w-6 h-6"></i>
                </div>
                <div className="space-y-1">
                  <h3 className="font-bold text-sm text-white">開発者認証コード入力</h3>
                  <p className="text-[11px] text-slate-400">暗証番号を入力してリミッターを解除してください</p>
                </div>

                <input 
                  type="password" 
                  maxLength="8"
                  value={cheatPassword} 
                  onChange={(e) => {
                    setCheatPassword(e.target.value);
                    setCheatError(false);
                  }}
                  placeholder="Password"
                  className={`w-full bg-slate-950 border-2 rounded-xl py-2 px-3 text-center text-lg font-mono font-bold text-white focus:outline-none ${
                    cheatError ? 'border-red-500 animate-shake' : 'border-slate-700 focus:border-amber-400'
                  }`}
                />
                {cheatError && (
                  <div className="text-[11px] text-red-400 font-bold">認証コードが違います</div>
                )}

                <div className="flex space-x-2 pt-1">
                  <button 
                    onClick={() => {
                      setIsCheatAuthOpen(false);
                      setCheatPassword('');
                      setCheatError(false);
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={handleVerifyCheatPassword}
                    className="flex-1 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs shadow hover:bg-amber-400"
                  >
                    解錠
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 開発者用チート操作パネル */}
          {isCheatPanelOpen && (
            <div className="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto animate-fade-in">
              <div className="bg-slate-900 border-2 border-amber-400 rounded-3xl p-5 max-w-sm w-full space-y-4 shadow-neon-gold">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <div className="flex items-center space-x-1.5 text-amber-400 font-bold text-sm">
                    <i data-lucide="unlock" className="w-4 h-4"></i>
                    <span>開発者用ステータス操作</span>
                  </div>
                  <button onClick={() => setIsCheatPanelOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  {[
                    { key: 'strength', name: '筋力 (STR)', val: player.stats.strength, color: 'text-red-400' },
                    { key: 'agility', name: '俊敏 (AGI)', val: player.stats.agility, color: 'text-cyan-400' },
                    { key: 'flexibility', name: '柔軟 (FEX)', val: player.stats.flexibility, color: 'text-emerald-400' },
                    { key: 'intelligence', name: '知力 (INT)', val: player.stats.intelligence, color: 'text-purple-400' },
                  ].map(s => (
                    <div key={s.key} className="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center">
                      <div>
                        <span className={`font-bold ${s.color}`}>{s.name}</span>
                        <span className="text-white font-mono font-bold ml-2">{s.val}</span>
                      </div>
                      <div className="flex space-x-1">
                        <button onClick={() => applyCheatStat(s.key, 10)} className="px-2 py-1 rounded bg-slate-800 text-amber-300 font-bold border border-slate-700 hover:bg-slate-700">+10</button>
                        <button onClick={() => applyCheatStat(s.key, 50)} className="px-2 py-1 rounded bg-slate-800 text-amber-400 font-bold border border-slate-700 hover:bg-slate-700">+50</button>
                        <button onClick={() => applyCheatStat(s.key, 0)} className="px-2 py-1 rounded bg-red-950 text-red-300 border border-red-800 hover:bg-red-900">0</button>
                      </div>
                    </div>
                  ))}

                  <div className="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center">
                    <div>
                      <span className="font-bold text-amber-300">所持金</span>
                      <span className="text-white font-mono font-bold ml-2">{player.gold} G</span>
                    </div>
                    <button onClick={() => applyCheatGold(1000)} className="px-3 py-1 rounded bg-amber-500 text-slate-950 font-bold shadow">
                      +1000 G
                    </button>
                  </div>

                  <div className="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center">
                    <div>
                      <span className="font-bold text-cyan-300">鍛錬継続（信用）</span>
                      <span className="text-white font-mono font-bold ml-2">{player.streakCount || 1}日</span>
                    </div>
                    <button onClick={() => applyCheatStreak(7)} className="px-3 py-1 rounded bg-cyan-500 text-slate-950 font-bold shadow">
                      +7日
                    </button>
                  </div>
                </div>

                <button 
                  onClick={() => setIsCheatPanelOpen(false)}
                  className="w-full py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs shadow hover:bg-amber-400"
                >
                  完了して戻る
                </button>
              </div>
            </div>
          )}

          {/* 初期化確認モーダル */}
          {isResetConfirmOpen && (
            <div className="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-6">
              <div className="bg-slate-900 border-2 border-red-500/80 rounded-2xl p-5 max-w-xs w-full text-center space-y-3.5 shadow-2xl animate-fade-in">
                <div className="w-12 h-12 rounded-full bg-red-500/20 text-red-400 border border-red-500/40 flex items-center justify-center mx-auto">
                  <i data-lucide="alert-octagon" className="w-6 h-6"></i>
                </div>
                <h3 className="font-bold text-sm text-white">本当に初期化しますか？</h3>
                <p className="text-xs text-slate-300 leading-relaxed">
                  鍛錬したステータス、所持ゴールド、獲得した称号など、<br/>
                  <strong className="text-red-400">すべての記録が消去され初期状態（見習い冒険者）に戻ります。</strong><br/>
                  この操作は元に戻せません。
                </p>

                <div className="flex space-x-2 pt-1">
                  <button 
                    onClick={() => setIsResetConfirmOpen(false)}
                    className="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs hover:bg-slate-700"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={executeReset}
                    className="flex-1 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-xs shadow-lg shadow-red-900/50"
                  >
                    初期化を実行
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App/>, document.getElementById('root'));
  </script>
</body>
</html>
